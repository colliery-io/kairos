---
# Kairos dev/test stack (KAIROS-A-0013 dev profile): Postgres 16 + Dex.
# Dex replaces Keycloak for dev/test per KAIROS-A-0010; Keycloak returns as
# the production reference deployment in M2/M5.
#
# Postgres is `pgvector/pgvector:pg16` — stock `postgres:16` upstream, with
# pgvector added. KAIROS-A-0021 rule 2 makes the extension a requirement rather
# than an option (KAIROS-T-0187), and stock postgres:16 ships only `pg_trgm` and
# `plpgsql`, so the dev stack has to carry it or nothing local can migrate.
# The project name is declared, and it is `kairos-dev` (COLLIERY-T-0226).
#
# Everything compose names for this stack - the network, the volume, the
# container labels - starts with the project name. Left undeclared it was the
# directory's, and the database volume carried a name written by hand that
# happened to be what deploy/docker-compose.yaml (project `kairos`, volume
# `postgres_data`) resolves to. On 2026-09-27, on a machine that runs both,
# `angreal services up` started this PostgreSQL on the deployment's live data
# directory.
#
# So nothing here is named by hand any more except the two containers, and
# they carry the same prefix. A name derived from `kairos-dev` cannot land in
# the namespace of a deployment called `kairos`.
name: kairos-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kairos-dev-postgres
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: kairos
      POSTGRES_DB: kairos
    ports:
      - "41432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos"]
      interval: 5s
      timeout: 5s
      retries: 5

  dex:
    image: dexidp/dex:v2.43.1
    container_name: kairos-dev-dex
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      # 41558 everywhere (issuer, listener, host) — Dex's default 5556 (and
      # 5557) collide with other local Dex instances.
      - "41558:41558"
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    healthcheck:
      # Dex serves healthz under the issuer path (/dex); busybox wget ships in the image.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:41558/dex/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  # No `name:`. Compose derives `kairos-dev_postgres_data` from the project
  # above, which is the point: see the note on `name:` at the top.
  postgres_data:
