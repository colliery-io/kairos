# Kairos CI — runs the KAIROS-A-0012 verification gates via angreal so that
# CI and the agent completion gate are the exact same commands.
#
# Gates (sequential by design, single job):
#   1. cargo fmt --check
#   2. cargo clippy --workspace --all-targets -- -D warnings
#   3. angreal test unit          (tier 1: pure cargo, no services)
#   4. angreal test integration   (tiers 2+3: task drives compose up/down itself)
#
# NOTE: this repo has no GitHub remote yet. Activation steps are documented
# in README.md ("CI" section): create the remote, push, and enable branch
# protection requiring the `ci` check.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        # rustup (>= 1.28, preinstalled on ubuntu-latest) reads
        # rust-toolchain.toml and installs the pinned channel + components
        # (rustfmt, clippy) when invoked with no arguments.
        run: |
          rustup toolchain install
          rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify Docker is available
        # `angreal test integration` drives docker compose itself
        # (up --wait / down -v); this step just fails fast if the
        # runner image ever loses docker.
        run: |
          docker version
          docker compose version

      - name: Install libpq (diesel postgres backend links against it)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install angreal
        run: |
          pip install "angreal==2.8.8"
          angreal --version

      - name: Gate 1 — cargo fmt
        run: cargo fmt --check

      - name: Gate 2 — cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Gate 3 — angreal test unit
        run: angreal test unit

      - name: Gate 4 — angreal test integration
        run: angreal test integration

      # KAIROS-T-0023 (A-0005 §6): the OpenAPI document is a CI artifact
      # per run, enabling client SDK generation without a running server.
      # `write_spec_artifact` is a pure test (no services) that writes the
      # aggregated spec to target/openapi.json.
      - name: Generate OpenAPI artifact
        run: cargo test -p kairos-server --test openapi write_spec_artifact

      # The REST reference pages in the book are GENERATED from that spec
      # (KAIROS-T-0170). Committing them keeps the docs build fast — it needs
      # no Rust toolchain — and this check is what stops them rotting: change
      # a handler's #[utoipa::path] without re-rendering and CI says so.
      - name: Check the generated REST reference is current
        run: python3 scripts/render-openapi.py --check

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi.json
          path: target/openapi.json
          if-no-files-found: error

      # KAIROS-T-0039 (A-0015): the GUI must keep compiling to wasm and
      # keep the token rule clean. `angreal web build` provisions the
      # wasm32 target (rustup) and trunk itself (pinned cargo install
      # into target/tools/, warmed by the rust-cache step) — CI runs the
      # exact same entry point developers do. `angreal web lint` is the
      # docs/gui-conventions.md conventions grep (no hardcoded colors).
      - name: Gate 5 — GUI conventions grep
        run: angreal web lint

      - name: Gate 6 — GUI wasm build
        run: angreal web build --release

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Gate 7 — the chart actually renders, for every deployment shape in
      # `deploy/helm/kairos/ci/`.
      #
      # `helm lint` is NOT this gate, which is what KAIROS-T-0208 found: it
      # reports a template `fail` as INFO and exits 0, so the release workflow's
      # lint step passed on default values that the chart is supposed to refuse.
      # `helm template` is the one that returns non-zero.
      #
      # The two halves matter separately. The values sets prove each supported
      # shape renders; the refusals prove the guards actually fire, because a
      # guard that has stopped firing looks exactly like one that was never
      # needed.
      - name: Gate 7 — Helm chart renders
        run: |
          set -euo pipefail
          for values in deploy/helm/kairos/ci/*-values.yaml; do
            echo "--- rendering with $(basename "$values")"
            helm template ci-render deploy/helm/kairos --values "$values" >/dev/null
          done

          echo "--- the guards must refuse these"
          # No way for anyone to log in (KAIROS-T-0208).
          if helm template ci-render deploy/helm/kairos \
               --set dex.enabled=false \
               --set config.tenancy.singleTenant=demo >/dev/null 2>&1; then
            echo "FAIL: no issuer, no Dex and no local auth should be refused"
            exit 1
          fi
          # Two issuers (KAIROS-T-0200).
          if helm template ci-render deploy/helm/kairos \
               --set dex.enabled=true \
               --set config.oidc.issuerUrl=https://idp.example \
               --set config.oidc.audience=kairos \
               --set config.tenancy.singleTenant=demo >/dev/null 2>&1; then
            echo "FAIL: dex.enabled=true alongside an issuer should be refused"
            exit 1
          fi
          # Both tenancy modes at once (KAIROS-A-0005 §2).
          if helm template ci-render deploy/helm/kairos \
               --set config.localAuth.enabled=true \
               --set config.tenancy.singleTenant=demo \
               --set config.tenancy.baseDomain=kairos.example >/dev/null 2>&1; then
            echo "FAIL: naming both tenancy modes should be refused"
            exit 1
          fi
