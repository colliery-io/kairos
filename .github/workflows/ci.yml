# Kairos CI — the KAIROS-A-0012 verification gates, run as parallel jobs
# (KAIROS-T-0447). Each gate is the same command a developer runs.
#
#   changes      which parts of the tree the change touches
#   lint         Gate 1 cargo fmt, Gate 2 clippy, Gate 5 STE (docs and code),
#                Gate 6 GUI conventions grep, Gate 8 Helm chart renders
#   build-tests  compiles every test binary once (a nextest archive)
#   unit         Gate 3 (unit tests), the OpenAPI artifact and REST check
#   integration  Gate 4: the archive, split over 4 shards, each with its own
#                compose stack (Postgres, Dex, S3Mock)
#   bdd          Gate 4: the cucumber scenarios (their own runner), one job
#                for each of the two suites
#   web          Gate 7: the GUI wasm build (release with the size budget in
#                the queue and on main, debug on a PR)
#   e2e          tier 4 (`angreal test e2e --down`): the API and MCP golden
#                path and the Playwright GUI suite, in the queue only, split
#                over 2 shards, each with its own compose stack (KAIROS-T-0662),
#                in chromium only; e2e.yml adds Firefox and WebKit on a tag
#   ci           the one required check: it fails when a gate failed
#
# A change to the docs only runs lint. On a pull request a new push cancels
# the old run.
#
# Merges to main go through the GitHub merge queue (KAIROS-T-0650), and
# `ci` is the check that the ruleset of main requires. The `changes` job
# gives the stage of the run:
#
#   pr     a pull request: lint, unit (with the Python tests) and web. The
#          fast gates; the agent ran the integration tests it needs.
#   queue  the merge queue, on the merge commit of a group of pull
#          requests: every gate, integration, bdd and e2e included. e2e
#          runs beside build-tests and integration, not after them. It checks
#          the parts that the group changes against main. The web gate
#          builds in release, so the size budget is checked before main
#          moves (KAIROS-T-0656).
#   push   main: the queue tested this commit, and main moves to it. It
#          runs lint, build-tests and web only, to save the caches that
#          pull requests read. A push does not cancel the run before it.
#
# Run one shard locally: `cargo nextest run --profile ci --partition hash:2/4`
# with the compose stack up (`angreal services up`).

name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

# A pull request: one group, and a new push cancels the old run. main: a
# group for each commit, because GitHub keeps one waiting run per group and
# cancels the one before it, even with cancel-in-progress off.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # No debug info in CI: the test binaries are a fraction of the size, they
  # link faster, and the archive goes to the shards in seconds, not minutes.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      helm: ${{ steps.filter.outputs.helm }}
      python: ${{ steps.filter.outputs.python }}
      image: ${{ steps.filter.outputs.image }}
      e2e: ${{ steps.filter.outputs.e2e }}
      stage: ${{ steps.filter.outputs.stage }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Which parts changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          # A pull request diffs against its base; a merge queue run diffs
          # against the main commit under the group.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "push" ]; then
            # main: build each part, to save the caches.
            for part in rust web helm python; do echo "${part}=true" >> "$GITHUB_OUTPUT"; done
            # The release workflow builds the images of a tag.
            echo "image=false" >> "$GITHUB_OUTPUT"
            # e2e runs in the merge queue only (KAIROS-T-0662).
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            # The merge queue tested this commit (KAIROS-T-0650).
            echo "stage=push" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${EVENT}" = "merge_group" ]; then
            echo "stage=queue" >> "$GITHUB_OUTPUT"
          else
            echo "stage=pr" >> "$GITHUB_OUTPUT"
          fi
          files="$(git diff --name-only "${BASE}...HEAD")"
          echo "${files}"
          has() { echo "${files}" | grep -Eq "$1" && echo true || echo false; }
          # The workflow itself, the cargo setup and the angreal tasks run
          # every gate.
          all='^(\.github/workflows/ci\.yml|\.config/nextest\.toml|\.angreal/|Cargo\.(toml|lock)|rust-toolchain\.toml|\.cargo/)'
          # A unit test of kairos-cli reads reference/cli.md (KAIROS-T-0596).
          rust="$(has "${all}|^crates/|^scripts/render-openapi\.py|^docs/src/content/docs/reference/rest/|^docs/src/content/docs/reference/cli\.md$")"
          web="$(has "${all}|^crates/kairos-web/|^crates/kairos-client/")"
          helm="$(has "${all}|^deploy/helm/")"
          python="$(has "${all}|^plugin/|^\.claude-plugin/|^scripts/")"
          image="$(has '^(Dockerfile|\.dockerignore|scripts/image-smoke\.sh)$')"
          # The specs and their helpers. A change to Rust or the GUI runs
          # e2e too (the e2e job reads rust and web).
          e2e="$(has "${all}|^e2e/")"
          {
            echo "rust=${rust}"
            echo "web=${web}"
            echo "helm=${helm}"
            echo "python=${python}"
            echo "image=${image}"
            echo "e2e=${e2e}"
          } | tee -a "$GITHUB_OUTPUT"

  lint:
    name: lint
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install angreal
        run: pip install "angreal==2.8.8"

      # Gate 5 — procedural docs follow KAIROS-S-0009 (Simplified Technical
      # English). Baselined: `scripts/ste-baseline.json` holds the count per
      # file, and the gate fails only when a file gets WORSE. It does NOT
      # check the approved vocabulary (STE-V1): ASD owns its copyright.
      - name: Gate 5 — Simplified Technical English
        run: angreal docs ste

      # COLLIERY-T-0258: the same rules for the texts of errors in the Rust
      # code. `scripts/ste-code-baseline.json` is the ceiling.
      - name: Gate 5 — Simplified Technical English, the texts of the code
        run: angreal docs ste --code

      # KAIROS-T-0690: no refusal is built from the text of a library, and a
      # VALIDATION or NOT_FOUND refusal names its field.
      # `scripts/refusal-baseline.json` is the ceiling. Pure Python, no build.
      - name: Gate 5 — the refusals of the code
        run: angreal docs ste --refusals

      # KAIROS-T-0496: deploy/docker-compose.yaml passes each setting that
      # the configuration reference documents, and deploy/.env.example names
      # each one. Pure Python, no build.
      - name: The Compose file passes each setting of the book
        run: python scripts/check_compose_settings.py

      # KAIROS-T-0563: mcp-tools.md has one section for each tool of
      # tools.rs, and the page and the module docs give the same count.
      # Pure Python, no build.
      - name: The MCP tools page names each tool of the code
        run: python scripts/check_mcp_tools.py

      # KAIROS-T-0639: a new migration takes no long lock on a large table
      # (NOT VALID, then VALIDATE; CONCURRENTLY outside a transaction). Pure
      # Python, no build.
      - name: The new migrations follow the migration convention
        run: python scripts/check_migrations.py

      - name: Gate 6 — GUI conventions grep
        run: angreal web lint

      - name: Install Rust toolchain (from rust-toolchain.toml)
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
        run: rustup toolchain install

      - name: Gate 1 — cargo fmt
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
        run: cargo fmt --check

      - name: Install libpq
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Cache cargo
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Gate 2 — cargo clippy
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Set up Helm
        if: needs.changes.outputs.helm == 'true'
        uses: azure/setup-helm@v5

      # Gate 8 — the chart renders, for every deployment shape in
      # `deploy/helm/kairos/ci/`. `helm lint` is NOT this gate (KAIROS-T-0208):
      # it reports a template `fail` as INFO and exits 0. `helm template` is
      # the one that returns non-zero. The refusals prove the guards fire.
      - name: Gate 8 — Helm chart renders
        if: needs.changes.outputs.helm == 'true'
        run: |
          set -euo pipefail
          for values in deploy/helm/kairos/ci/*-values.yaml; do
            echo "--- rendering with $(basename "$values")"
            helm template ci-render deploy/helm/kairos --values "$values" >/dev/null
          done

          echo "--- the guards must refuse these"
          # No way for anyone to log in (KAIROS-T-0208).
          if helm template ci-render deploy/helm/kairos \
               --set dex.enabled=false \
               --set config.tenancy.singleTenant=demo >/dev/null 2>&1; then
            echo "FAIL: no issuer, no Dex and no local auth should be refused"
            exit 1
          fi
          # Two issuers (KAIROS-T-0200).
          if helm template ci-render deploy/helm/kairos \
               --set dex.enabled=true \
               --set config.oidc.issuerUrl=https://idp.example \
               --set config.oidc.audience=kairos \
               --set config.tenancy.singleTenant=demo >/dev/null 2>&1; then
            echo "FAIL: dex.enabled=true alongside an issuer should be refused"
            exit 1
          fi
          # Both tenancy modes at once (KAIROS-A-0005 §2).
          if helm template ci-render deploy/helm/kairos \
               --set config.localAuth.enabled=true \
               --set config.tenancy.singleTenant=demo \
               --set config.tenancy.baseDomain=kairos.example >/dev/null 2>&1; then
            echo "FAIL: naming both tenancy modes should be refused"
            exit 1
          fi

  # The Python tests alone, for a change that touches no Rust (the plugin
  # hooks and the Metis import script). With Rust, `angreal test unit` in
  # the unit job runs them.
  python:
    name: python
    needs: changes
    if: needs.changes.outputs.python == 'true' && needs.changes.outputs.rust != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Plugin hooks and the Metis import script
        run: |
          python -B -m unittest discover -s plugin/hooks -p 'test_*.py'
          python -B -m unittest discover -s scripts/metis_import -t scripts
          python -B -m unittest scripts/test_check_compose_settings.py
          python -B -m unittest scripts/test_check_mcp_tools.py
          python -B -m unittest scripts/test_check_migrations.py
          python -B -m unittest scripts/test_refusal_check.py

  build-tests:
    name: build-tests
    needs: changes
    # Not on a pull request: no integration or bdd job reads the archive.
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.stage != 'pr'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Every integration test target but the three cucumber runners (their
      # own harness, which nextest cannot list): those go to the bdd job.
      - name: Build the nextest archive
        run: |
          set -euo pipefail
          targets="$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          skip = {("kairos-cli", "index_bdd"), ("kairos-index", "bdd"), ("kairos-index", "scip_bdd")}
          for p in json.load(sys.stdin)["packages"]:
              for t in p["targets"]:
                  if "test" in t["kind"] and (p["name"], t["name"]) not in skip:
                      print("--package", p["name"], "--test", t["name"])
          ')"
          # shellcheck disable=SC2086
          cargo nextest archive ${targets} --archive-file tests.tar.zst
          ls -la tests.tar.zst
          df -h /

      - name: Build the cucumber runners
        run: |
          set -euo pipefail
          mkdir -p bdd-bin
          cargo test --no-run --message-format=json \
              -p kairos-cli --test index_bdd -p kairos-index --test bdd --test scip_bdd \
            | python3 -c '
          import json, shutil, sys
          for line in sys.stdin:
              m = json.loads(line)
              if m.get("reason") == "compiler-artifact" and m.get("executable") and m["target"]["name"] in ("index_bdd", "bdd", "scip_bdd"):
                  shutil.copy(m["executable"], "bdd-bin/" + m["target"]["name"])
                  print(m["target"]["name"], m["executable"])
          '
          # index_bdd runs the CLI at its compile-time path.
          cp target/debug/kairos bdd-bin/kairos
          ls -la bdd-bin

      - name: Upload the nextest archive
        uses: actions/upload-artifact@v6
        with:
          name: nextest-archive
          path: tests.tar.zst
          retention-days: 1
          if-no-files-found: error
          # The archive is zstd already.
          compression-level: 0

      - name: Upload the cucumber runners
        uses: actions/upload-artifact@v6
        with:
          name: bdd-bin
          path: bdd-bin/
          retention-days: 1
          if-no-files-found: error


  # Gate 3 and the OpenAPI check, beside build-tests so the shards do not
  # wait for them. It restores the cache of build-tests and saves none.
  unit:
    name: unit
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.stage != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install angreal
        run: pip install "angreal==2.8.8"

      - name: Gate 3 — angreal test unit
        run: angreal test unit

      # KAIROS-T-0023 (A-0005 §6): the OpenAPI document is a CI artifact per
      # run. `write_spec_artifact` is a pure test (no services) that writes
      # the spec to target/openapi.json.
      - name: Generate OpenAPI artifact
        run: cargo test -p kairos-server --test openapi write_spec_artifact

      # The REST reference pages are GENERATED from that spec (KAIROS-T-0170).
      - name: Check the generated REST reference is current
        run: python3 scripts/render-openapi.py --check

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v6
        with:
          name: openapi.json
          path: target/openapi.json
          if-no-files-found: error

  integration:
    name: integration (${{ matrix.shard }}/4)
    needs: [changes, build-tests]
    if: needs.changes.outputs.stage == 'queue'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # The compose stack and the test servers bind host ports 41080-41900,
      # inside the default ephemeral range (32768-60999). An outbound
      # connection of an earlier step can hold one of them, and compose up
      # then fails with "address already in use" (KAIROS-T-0662).
      - name: Keep the ports of the stack out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_port_range="42000 65000"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Start the compose stack (Postgres, Dex, S3Mock)
        run: docker compose -f .angreal/docker-compose.yaml up -d --wait

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Download the nextest archive
        uses: actions/download-artifact@v7
        with:
          name: nextest-archive

      # The test binaries have the paths of the build job compiled in
      # (CARGO_BIN_EXE_*, CARGO_MANIFEST_DIR). Each job checks out to the
      # same folder, so the archive goes into ./target, where they look.
      - name: Gate 4 — integration tests, shard ${{ matrix.shard }} of 4
        run: |
          cargo nextest run --profile ci --archive-file tests.tar.zst \
            --workspace-remap . --extract-to . --extract-overwrite \
            --partition hash:${{ matrix.shard }}/4

  bdd:
    name: bdd (${{ matrix.suite.name }})
    needs: [changes, build-tests]
    if: needs.changes.outputs.stage == 'queue'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: kairos-index, dir: crates/kairos-index, bin: bdd }
          - { name: kairos-index-scip, dir: crates/kairos-index, bin: scip_bdd }
          - { name: kairos-cli, dir: crates/kairos-cli, bin: index_bdd }
    steps:
      # The compose stack and the test servers bind host ports 41080-41900,
      # inside the default ephemeral range (32768-60999). An outbound
      # connection of an earlier step can hold one of them, and compose up
      # then fails with "address already in use" (KAIROS-T-0662).
      - name: Keep the ports of the stack out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_port_range="42000 65000"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Start the compose stack (Postgres, Dex, S3Mock)
        run: docker compose -f .angreal/docker-compose.yaml up -d --wait

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install angreal
        run: pip install "angreal==2.8.8"

      # The kairos-index scenarios use the pinned rust-analyzer release
      # (COLLIERY-T-1858) and the pinned std source (COLLIERY-T-1860), and
      # never download them themselves.
      - name: Fetch the pinned rust-analyzer and std source
        run: angreal dev fetch-rust-analyzer

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: Download the cucumber runners
        uses: actions/download-artifact@v7
        with:
          name: bdd-bin
          path: bdd-bin

      - name: Gate 4 — the cucumber scenarios
        run: |
          set -euo pipefail
          chmod +x bdd-bin/*
          # The runners have the paths of the build job compiled in, and each
          # job checks out to the same folder.
          mkdir -p target/debug
          mv bdd-bin/kairos target/debug/kairos
          # `cargo test` gives its children the pinned toolchain in
          # RUSTUP_TOOLCHAIN; the index builder runs cargo in a temporary
          # folder outside the repository, where rust-toolchain.toml does not
          # reach. Give it the same.
          RUSTUP_TOOLCHAIN="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          export RUSTUP_TOOLCHAIN
          echo "RUSTUP_TOOLCHAIN=${RUSTUP_TOOLCHAIN}"
          cd "${{ matrix.suite.dir }}"
          "${GITHUB_WORKSPACE}/bdd-bin/${{ matrix.suite.bin }}"

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: web
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install angreal
        run: pip install "angreal==2.8.8"

      # KAIROS-T-0039 (A-0015): the GUI must keep compiling to wasm.
      # `angreal web build` provisions the wasm32 target and trunk itself.
      # The release profile (wasm-opt) and its size budget run in the merge
      # queue and on main (KAIROS-T-0656), so the queue does not merge a
      # bundle over the budget. A pull request gets the debug profile, which
      # compiles the same code faster.
      - name: Gate 7 — GUI wasm build
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "${EVENT}" = "push" ] || [ "${EVENT}" = "merge_group" ]; then
            angreal web build --release
          else
            angreal web build
          fi

  # Tier 4 (KAIROS-A-0012), in the merge queue only (KAIROS-T-0662): the
  # same steps as e2e.yml, which still runs on a release tag and on
  # dispatch. It needs only `changes`, so it runs beside build-tests and
  # integration. The Playwright suite runs one spec at a time on the shared
  # demo tenant, so it is split over 2 shards of the spec files. Each shard
  # has its own runner, compose stack and seed, and runs the golden path too
  # (about one second). A shard takes about 7 minutes of setup (the server
  # and wasm builds, the browsers) and a few minutes of Playwright. Add a
  # shard here when the suite grows.
  e2e:
    name: e2e (${{ matrix.shard }}/2)
    needs: changes
    if: >-
      needs.changes.outputs.stage == 'queue' && (
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.e2e == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      # The compose stack and the test servers bind host ports 41080-41900,
      # inside the default ephemeral range (32768-60999). An outbound
      # connection of an earlier step can hold one of them, and compose up
      # then fails with "address already in use" (KAIROS-T-0662).
      - name: Keep the ports of the stack out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_port_range="42000 65000"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show

      # The debug build of build-tests; a queue run saves no cache.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: false

      - name: Verify Docker is available
        run: |
          docker version
          docker compose version

      - name: Install libpq (diesel postgres backend links against it)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install angreal
        run: |
          pip install "angreal==2.8.8"
          angreal --version

      # The GUI leg runs Playwright from e2e/; the angreal task installs the
      # npm packages and the browsers itself.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # The release binary of trunk, where `angreal web build` looks first.
      # Without it the task runs `cargo install trunk`: about 6 minutes.
      - name: Install trunk (release binary)
        env:
          TRUNK_VERSION: "0.21.14"
          TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b
        run: |
          set -euo pipefail
          curl -sSfL -o trunk.tar.gz \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TRUNK_SHA256}  trunk.tar.gz" | sha256sum -c -
          mkdir -p target/tools/bin
          tar -xzf trunk.tar.gz -C target/tools/bin trunk
          rm trunk.tar.gz
          target/tools/bin/trunk --version

      # Compose up, the server and wasm builds, the seed, the API and MCP
      # golden path, then this shard of the Playwright GUI suite; compose
      # down after.
      - name: Tier 4 — angreal test e2e, shard ${{ matrix.shard }} of 2
        run: angreal test e2e --down --shard ${{ matrix.shard }}/2

      # The trace, screenshot and video of each failed spec.
      - name: Upload the Playwright results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-results-${{ matrix.shard }}
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # A pull request that changes the Dockerfile builds the hosted image for
  # amd64 (no push) and runs its smoke check, so a release does not find
  # the fault. It shares the build cache of the release workflow.
  image:
    name: image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the hosted image (amd64)
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            KAIROS_SERVER_FEATURES=embed-web
          tags: kairos:ci
          load: true
          cache-from: type=gha,scope=image-hosted-amd64
          cache-to: type=gha,mode=max,scope=image-hosted-amd64
      - name: Smoke check the image
        run: scripts/image-smoke.sh kairos:ci

  # The one required check. A gate that a change does not touch is skipped,
  # and a skipped gate passes; a failed or cancelled gate fails this job.
  ci:
    name: ci
    if: always()
    needs: [changes, lint, python, build-tests, unit, integration, bdd, web, e2e, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every gate passed or was not needed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "${RESULTS}" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          for k, v in needs.items():
              print(k + ": " + v["result"])
          sys.exit("failed: " + str(bad) if bad else 0)
          '
