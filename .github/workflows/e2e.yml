# Kairos E2E smoke — KAIROS-A-0012 tier 4 (`angreal test e2e`), the API + MCP
# golden path plus the KAIROS-T-0045 GUI Playwright smoke leg.
#
# CI decision (KAIROS-A-0012, amended by KAIROS-T-0662 on 2026-10-19): the
# e2e tier runs in the merge queue. The `e2e` job of ci.yml runs it in the
# queue stage, not in the PR stage (it cycles the full compose stack, builds
# the wasm bundle, boots two servers, and drives a real browser), and the
# required check `ci` counts its result. So a change does not reach main
# with a failed e2e. It also runs:
#   - locally / in agent completion, on demand: `angreal test e2e`
#   - here, manually (workflow_dispatch) and on release tags, so a release
#     tag runs it again.
#
# When the server OCI image job lands (KAIROS-T-0047 anchor in release.yml),
# this job is the natural pre-publish gate to wire as a dependency.

name: e2e

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The compose stack and the test servers bind host ports 41080-41900,
      # inside the default ephemeral range (32768-60999). An outbound
      # connection of an earlier step can hold one of them, and compose up
      # then fails with "address already in use" (KAIROS-T-0662).
      - name: Keep the ports of the stack out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_port_range="42000 65000"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify Docker is available
        run: |
          docker version
          docker compose version

      - name: Install libpq (diesel postgres backend links against it)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install angreal
        run: |
          pip install "angreal==2.8.8"
          angreal --version

      - name: Set up Node.js
        # The GUI leg runs Playwright from e2e/ (npx playwright test); the
        # angreal task installs the npm deps + chromium itself, guarded.
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # `angreal test e2e` drives compose up/down, builds the server + wasm
      # bundle, seeds, boots the servers, runs the API golden path, then the
      # Playwright GUI smoke leg. Exit code propagates.
      # KAIROS-T-0409: a release tag also proves the sandbox of the uploaded
      # sites in Firefox and WebKit. The merge queue runs chromium only (#276).
      - name: angreal test e2e
        run: angreal test e2e --down
        env:
          KAIROS_E2E_ENGINES: all
