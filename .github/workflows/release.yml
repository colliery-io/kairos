# Kairos release — KAIROS-T-0038 (distribution per KAIROS-A-0015, release
# conventions per KAIROS-A-0013: versioned tags only, never `latest`).
#
# Triggered by pushing a version tag (`v*`, e.g. `v0.1.0`). Builds the
# `kairos` CLI binary natively on each platform:
#
#   macos-14         -> aarch64-apple-darwin      (Apple Silicon)
#   macos-15-intel   -> x86_64-apple-darwin       (Intel; macos-13 was
#                       retired by GitHub — actionlint 2026 label set)
#   ubuntu-24.04     -> x86_64-unknown-linux-gnu
#   ubuntu-24.04-arm -> aarch64-unknown-linux-gnu (GitHub-hosted arm64
#                       runner — native build, no cross toolchain needed)
#
# Each artifact is `kairos-<version>-<target>.tar.gz` containing the binary
# (plus LICENSE files if the repo grows any — none exist today). All four
# tarballs are attached to the GitHub release for the tag via
# softprops/action-gh-release.
#
# The CLI links kairos-client (reqwest + rustls); it does NOT link libpq,
# so no native Postgres packages are installed here (verified in
# KAIROS-T-0038: `cargo build -p kairos-cli --release` compiles no diesel).

name: release

on:
  push:
    tags: ["v*"]

# `contents: write` lets the release job create/update the GitHub release
# for the tag and upload the tarballs as release assets.
permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag and check it matches Cargo.toml
        # Tag `v0.1.0` -> version `0.1.0`. Guard: the workspace version
        # ([workspace.package] in Cargo.toml) must match the tag, so a
        # mis-tagged release fails fast instead of shipping a binary whose
        # `--version` disagrees with its artifact name.
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "${version}" != "${cargo_version}" ]; then
            echo "Tag version ${version} != workspace Cargo.toml version ${cargo_version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Install Rust toolchain (from rust-toolchain.toml)
        # Same convention as ci.yml: rustup (>= 1.28) with no arguments
        # reads rust-toolchain.toml and installs the pinned channel +
        # components. Builds are native per runner, so no extra targets.
        run: |
          rustup toolchain install
          rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build kairos (release)
        run: cargo build -p kairos-cli --release

      - name: Verify --version matches the tag
        run: |
          actual="$(./target/release/kairos --version)"
          expected="kairos ${VERSION}"
          if [ "${actual}" != "${expected}" ]; then
            echo "kairos --version reported '${actual}', expected '${expected}'" >&2
            exit 1
          fi

      - name: Package tarball
        # kairos-<version>-<target>.tar.gz containing the binary at the archive
        # root, alongside LICENSE and NOTICE — Apache-2.0 section 4 asks a
        # redistributor to pass both along, and a downloaded tarball is the one
        # artefact whose recipient may never see the repository.
        run: |
          archive="kairos-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${archive}"
          cp target/release/kairos "dist/${archive}/"
          for f in LICENSE NOTICE; do
            if [ ! -f "$f" ]; then echo "$f is missing from the repository" >&2; exit 1; fi
            cp "$f" "dist/${archive}/"
          done
          tar -czf "dist/${archive}.tar.gz" -C "dist/${archive}" .
          # Checksum from inside dist/ so the file names just the tarball
          # and `shasum -a 256 -c` works next to a downloaded artifact.
          (cd dist && shasum -a 256 "${archive}.tar.gz" | tee "${archive}.tar.gz.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kairos-${{ env.VERSION }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: attach binaries to release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release and attach tarballs
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

  # ---------------------------------------------------------------------
  # KAIROS-T-0047 / KAIROS-T-0180: publish the single OCI image
  # (KAIROS-A-0013 "one image, one binary") as a MULTI-ARCH manifest.
  #
  # v0.1.0 shipped linux/amd64 only. The original note here said arm64 was
  # deferred because QEMU-emulated cross-compilation of the Rust + wasm +
  # trunk workspace is slow and flaky — which is true, and is why this does
  # not use QEMU. Each architecture builds on its OWN native runner, exactly
  # as the CLI binary matrix above already does, and a third job stitches the
  # two digests into one manifest list.
  #
  # That deferral turned out to cost more than it looked (KAIROS-T-0180):
  # amd64-only does not merely exclude arm64 production clusters, it breaks
  # the most common first-run path — a local kind cluster on an Apple Silicon
  # laptop — with "no match for platform in manifest" and no workaround, since
  # a kind node's own containerd rejects the manifest before emulation is ever
  # consulted.
  #
  # The two arch builds run in parallel, so wall-clock is close to unchanged.
  image:
    name: build image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag and check it matches Cargo.toml
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "${version}" != "${cargo_version}" ]; then
            echo "Tag version ${version} != workspace Cargo.toml version ${cargo_version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          # No tag here: each arch is pushed as an untagged digest, and the
          # merge job below is what gives the release its tag. Tagging both
          # would make them race, with the loser silently overwritten.
          outputs: type=image,name=ghcr.io/colliery-io/kairos,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into one tagged manifest list, so
  # `ghcr.io/colliery-io/kairos:<version>` resolves on both architectures.
  image-manifest:
    name: publish the image manifest
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the manifest list
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd /tmp/digests
          # Versioned tag only — never `latest` (KAIROS-A-0013).
          docker buildx imagetools create \
            -t "ghcr.io/colliery-io/kairos:${version}" \
            $(printf 'ghcr.io/colliery-io/kairos@sha256:%s ' *)

      - name: Verify both architectures are in the manifest
        # A manifest that resolves on only one arch is the bug this job
        # exists to prevent, so fail the release rather than publish it.
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest="$(docker buildx imagetools inspect --raw "ghcr.io/colliery-io/kairos:${version}")"
          echo "$manifest"
          for arch in amd64 arm64; do
            echo "$manifest" | grep -q "\"architecture\": *\"${arch}\"" \
              || { echo "manifest is missing linux/${arch}" >&2; exit 1; }
          done

  # ---------------------------------------------------------------------
  # Publish the Helm chart as an OCI artifact alongside the image.
  #
  # Before this job the release pipeline shipped binaries and an image but
  # nothing published `deploy/helm/kairos` — its README said
  # `helm install kairos deploy/helm/kairos`, so the only way to deploy a
  # given release was to check the repo out at the right commit and hope the
  # chart in your tree matched the image you were pointing at. The chart is
  # part of the release surface, so it gets released.
  #
  # OCI rather than a gh-pages `helm repo`: GHCR auth and `packages: write`
  # are already set up for the image job above, so this needs no new secret
  # and no branch. Helm has supported OCI registries natively since 3.8.
  #
  # Pushed to `oci://ghcr.io/colliery-io/charts`, which makes the chart
  # `oci://ghcr.io/colliery-io/charts/kairos` (helm appends the chart name).
  chart:
    name: publish helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the chart's appVersion matches the tag
        # Same class of guard as the binary and image jobs. `appVersion` is
        # the Kairos release the chart deploys, and `image.tag` defaults to
        # it, so a chart whose appVersion disagrees with the tag would
        # quietly deploy a different version than the one being released.
        #
        # The chart's own `version` is deliberately NOT guarded: it tracks
        # changes to the chart and may legitimately move independently of
        # the app (a values fix with no new Kairos release bumps one and not
        # the other). It is what the pushed artifact is versioned by.
        run: |
          version="${GITHUB_REF_NAME#v}"
          app_version="$(grep -m1 '^appVersion:' deploy/helm/kairos/Chart.yaml | cut -d'"' -f2)"
          chart_version="$(grep -m1 '^version:' deploy/helm/kairos/Chart.yaml | awk '{print $2}')"
          if [ "${version}" != "${app_version}" ]; then
            echo "Tag version ${version} != chart appVersion ${app_version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "CHART_VERSION=${chart_version}" >> "$GITHUB_ENV"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint the chart
        # The chart renders with required values missing reported as INFO,
        # so lint is a real gate here: it fails on template errors.
        run: helm lint deploy/helm/kairos

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push the chart
        run: |
          helm package deploy/helm/kairos --destination dist
          helm push "dist/kairos-${CHART_VERSION}.tgz" oci://ghcr.io/colliery-io/charts
