[workspace]
resolver = "2"
members = [
    "crates/kairos-core",
    "crates/kairos-db",
    "crates/kairos-server",
    "crates/kairos-client",
    "crates/kairos-cli",
    "crates/kairos-web",
    "crates/kairos-soak",
]

[workspace.package]
version = "0.1.1"
edition = "2024"

[workspace.dependencies]
# Intra-workspace crates
kairos-core = { path = "crates/kairos-core" }
kairos-db = { path = "crates/kairos-db" }
kairos-client = { path = "crates/kairos-client" }

# HTTP layer (KAIROS-A-0009)
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
tower = "0.5.3"
tower-http = "0.7.0"

# Database layer (KAIROS-A-0009)
diesel = { version = "2.3.10", features = ["postgres", "chrono", "uuid"] }
# diesel-async is community-maintained: version-pinned exactly per KAIROS-A-0009;
# upgrades are deliberate tasks.
diesel-async = { version = "=0.9.2", features = ["postgres", "bb8"] }
diesel_migrations = { version = "2.3.0", features = ["postgres"] }
bb8 = "0.9.1"

# Column types (KAIROS-T-0009: chrono for TIMESTAMPTZ/DATE, uuid for UUID ids)
chrono = "0.4.42"
uuid = { version = "1.18.1", features = ["v4"] }

# Errors / serialization
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Observability
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# CLI
clap = { version = "4.6.1", features = ["derive"] }

# Frontend (KAIROS-A-0015). `aurora-dark` is published on crates.io as
# `colliery-io-aurora` (repo: github.com/colliery-io/aurora-dark).
leptos = "0.8.20"
aurora-dark = { package = "colliery-io-aurora", version = "0.1.0" }

# API docs / MCP
utoipa = "5.5.0"
rmcp = "2.2.0"

# Event push (KAIROS-A-0005 §5, KAIROS-T-0022): the server's dedicated
# LISTEN connection. Pinned exactly to the version diesel-async already
# pulls into the tree, so no second copy enters the lockfile; upgrades
# move in lockstep with the diesel-async pin above.
tokio-postgres = "=0.7.18"

# Auth (KAIROS-A-0010: local JWKS validation) — added by KAIROS-T-0017
jsonwebtoken = "9.3.1"
reqwest = { version = "0.12.24", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# GUI (KAIROS-T-0039, A-0015): the Leptos CSR app. `leptos_router` tracks the
# leptos 0.8 line; the wasm-side HTTP/browser bindings are the standard
# wasm-bindgen stack (kairos-client does NOT compile to wasm32 — see
# docs/gui-conventions.md "Data layer").
leptos_router = "0.8"
gloo-net = { version = "0.6.0", default-features = false, features = ["http", "json"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1.7"
# Client-side text diff for the history view (KAIROS-T-0044): pure Rust,
# wasm32-clean (no getrandom/tokio), line-level Myers/LCS diffing.
similar = "2.7.0"
# Markdown preview in the item detail page (KAIROS-T-0041). Pure-Rust and
# wasm32-compatible; default features off ("getopts" is example-only),
# "html" enables the push_html renderer.
pulldown-cmark = { version = "0.12.2", default-features = false, features = ["html"] }
# Embedded GUI assets for the single-binary release (A-0013); only compiled
# when kairos-server's off-by-default `embed-web` feature is enabled.
rust-embed = "8"
mime_guess = "2"
