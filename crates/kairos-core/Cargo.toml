[package]
name = "kairos-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
serde = { workspace = true }
# KAIROS-T-0098: forge webhook payloads are parsed here (pure, no I/O), so
# serde_json moved from dev-dependencies to a real dependency.
serde_json = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
sha2 = { workspace = true }
# COLLIERY-T-0267: the form of the URL of a repository. The crate is in the
# tree already (reqwest), so the lockfile gets no new package.
url = { workspace = true }
# KAIROS-T-0479: the forge filters (forge_filter.rs).
regex = { workspace = true }
# KAIROS-T-0504: the note headings (shared with the web app).
kairos-markdown = { workspace = true }
# KAIROS-T-0651: the line diff of item_history (history_diff.rs).
similar = { workspace = true }
# KAIROS-T-0730: the check of the typed sections (sections.rs).
kairos-plain = { workspace = true }
