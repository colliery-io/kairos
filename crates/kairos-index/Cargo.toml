[package]
name = "kairos-index"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The code index: symbols, file decisions and the summary pool, in SQLite (COLLIERY-I-0264)"

[dependencies]
kairos-narsil = { path = "vendor/narsil" }
thiserror = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
# The same tree-sitter as the vendored narsil code: the tree hash walks its trees.
tree-sitter = "0.26"
# The index is one SQLite file. `bundled` compiles SQLite in, so no system
# library is needed on a Mac, on Linux or in CI.
rusqlite = { version = "0.40", features = ["bundled"] }
# .kairos/index-rules.toml. The workspace already has toml 0.9 in the tree.
toml = "0.9"
# The walk of the tree: it honours .gitignore, so target/ and node_modules/
# are never read. Its globset matches the path rules.
ignore = "0.4"
globset = "0.4"
# The SCIP index of rust-analyzer is protobuf. prost is in the workspace tree
# already; the few messages are written by hand, so no protoc and no build
# script are needed.
prost = "0.14"
serde_json = { workspace = true }
# The temporary folder of the SCIP run, deleted at its end.
tempfile = "3.14.0"
# The download of the pinned rust-analyzer release (COLLIERY-T-1858): a
# gzip file from GitHub. Both crates are in the workspace tree already.
ureq = "3"
flate2 = "1"
# The pinned std source (COLLIERY-T-1860) is a .tar.gz from
# static.rust-lang.org.
tar = "0.4"
# The vectors of the summaries: the trait and the deterministic provider.
# The caller gives the provider; the local model (bge-small-en-v1.5) is the
# `local` feature of kairos-embed, which the server already builds.
kairos-embed = { path = "../kairos-embed", default-features = false }

# The llama.cpp summarizer (feature `llama`). llama-cpp-sys-2 builds
# llama.cpp from C++ source with cmake, which takes minutes. So it is not in
# the default build. Metal on a Mac; the CPU, with OpenMP, on Linux.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "=0.1.158", default-features = false, features = ["metal"], optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "=0.1.158", default-features = false, features = ["openmp"], optional = true }

[features]
default = []
# The real summarizer: Qwen3-4B-Instruct-2507 GGUF through llama.cpp. Needs
# cmake and a C++ compiler at build time.
llama = ["dep:llama-cpp-2"]

[dev-dependencies]
# The scenarios use the deterministic vectors; the measurement example uses
# the local model.
kairos-embed = { path = "../kairos-embed", features = ["local"] }
# The BDD harness (COLLIERY-I-0264, "The tests: behaviour first").
cucumber = "0.23"
tokio = { workspace = true }

# The measurement tool: build, then summarize with the real model.
[[example]]
name = "summarize"
required-features = ["llama"]

# The scenarios in tests/features/. cucumber has its own runner, not libtest.
[[test]]
name = "bdd"
harness = false
