# The call edges of this fixture (COLLIERY-T-1848, COLLIERY-T-1849): each
# edge, and no other. The scenario "The edges match the fixture's expected
# edges" compares the 2 lists both ways.
#
# A symbol is named by its file, its name and its first line, as in
# expected-symbols.toml. Each edge has:
#
#   caller      the calling symbol
#   at          the line of the called name
#   class       "certain", "possible" or "external" (COLLIERY-I-0264)
#   callee      the called symbol, for a certain edge
#   candidates  the symbols that the name matches, for a possible edge
#   origin      "scip", "name" or "macro-text"; by default "scip" for a
#               Rust caller and "name" for the other languages
#   external    the called name, for an external edge: as SCIP names it
#               for Rust (`Vec::push`), as the code writes it for the other
#               languages (`fmt.Println`). When the part before the name is
#               not a plain path, only the name is kept (`split` in
#               `line.rstrip("\n").split(",")`).
#
# A Rust macro call (assert_eq!) is not an edge, but a call in its arguments
# is: SCIP resolves it. A call in the text of a macro that SCIP does not
# expand as code gets a name class with the origin "macro-text"
# (COLLIERY-T-1851).

