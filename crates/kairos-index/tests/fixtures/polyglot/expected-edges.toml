# The call edges of this fixture (COLLIERY-T-1848, for COLLIERY-T-1849).
#
# A symbol is named by its file, its name and its first line, as in
# expected-symbols.toml. Each edge has:
#
#   caller      the calling symbol
#   at          the line of the call
#   class       "certain", "possible" or "external" (COLLIERY-I-0264)
#   callee      the called symbol, for a certain edge
#   candidates  the symbols that the name matches, for a possible edge
#   external    the called name, for an external edge
#
# Each call to a function or a class of the fixture is listed. Calls into
# std or into a dependency are listed only where they test something, for
# example a `push` on a Vec that must not resolve to `Stack::push`. A Rust
# macro call (assert_eq!) is not an edge.

