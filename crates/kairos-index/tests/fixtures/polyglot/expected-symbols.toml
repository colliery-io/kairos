# The symbols that the index must have for this fixture, and no others
# (COLLIERY-T-1848). One entry for each symbol:
#
#   file       the path from the fixture root
#   name       the symbol name
#   container  the name of the nearest symbol that holds it ("" at the top)
#   kind       the narsil kind, in snake case
#   language   the narsil language
#   lines      the first and the last line, from 1, both included
#   is_test    true for test code
#
# The `[[file]]` entries give the decision and the default rule for the
# special files of the fixture.

[[file]]
path = "vendor/leftpad/leftpad.go"
decision = "vendored"
rule = "vendored-dir"

[[file]]
path = "web/src/generated/api.ts"
decision = "generated"
rule = "generated-header"

[[file]]
path = "tests/fixtures/sample_handler.py"
decision = "fixture"
rule = "fixture-dir"

[[file]]
path = "python/tests/test_report.py"
decision = "test"
rule = "test-path"

