[package]
name = "kairos-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kairos-core = { workspace = true }
kairos-db = { workspace = true }
kairos-embed = { workspace = true }
kairos-client = { workspace = true }
# `r2d2` feeds the small sync pool bridging async handlers to the sync
# kairos-db services (KAIROS-T-0018, see `src/blocking.rs`).
diesel = { workspace = true, features = ["r2d2"] }
diesel-async = { workspace = true }
chrono = { workspace = true }
utoipa = { workspace = true }
# `ws` feeds the /ws/events channel (KAIROS-T-0022, A-0005 §5).
# `http2` (KAIROS-T-0613): h2 is in the tree already, through hyper and
# reqwest. A client that speaks HTTP/2 with prior knowledge gets it; HTTP/1.1
# does not change.
axum = { workspace = true, features = ["ws", "http2"] }
tokio = { workspace = true }
# The dedicated LISTEN connection behind /ws/events (KAIROS-T-0022);
# version pinned in the workspace manifest.
tokio-postgres = { workspace = true }
tower = { workspace = true }
# KAIROS-T-0603: gzip and brotli on every response that asks for it (the API
# JSON, the GUI assets); `brotli` also pre-compresses the embedded assets once.
tower-http = { workspace = true, features = ["compression-gzip", "compression-br"] }
brotli = "8"
tracing = { workspace = true }
# KAIROS-T-0196: OTLP trace export, enabled at runtime by KAIROS_OTEL_ENDPOINT.
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
# KAIROS-T-0674: the path of a wrong argument in a refusal of an MCP tool.
# The lockfile has it already (axum).
serde_path_to_error = "0.1.20"
thiserror = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
# COLLIERY-T-0236: `set-password` asks on the terminal with the echo off.
rpassword = "7.5.4"
# SCIM provisioning (KAIROS-T-0025, A-0016): token secrets are 32 random
# bytes, stored as SHA-256 hex. Versions match what the lockfile already
# carries transitively.
sha2 = "0.10.9"
rand = "0.9.4"
# COLLIERY-T-3105: AES-256-GCM for the read token of a repository, and the
# base64 of KAIROS_SECRETS_KEY. Both are in the lock file already.
ring = "0.17"
base64 = "0.22"
# KAIROS-T-0201: local-account password hashing (argon2id). NOT used for API
# keys or session tokens — those are 32 random bytes, where sha2 above is right.
argon2 = { workspace = true }
# The MCP endpoint at /mcp (KAIROS-A-0011, KAIROS-T-0026): official Rust
# SDK, streamable-HTTP server transport mounted as a tower service.
rmcp = { workspace = true, features = [
    "server",
    "transport-streamable-http-server",
] }
# GUI serving (KAIROS-T-0039, A-0015): content types for the SPA assets;
# rust-embed only compiles under the `embed-web` feature below.
mime_guess = { workspace = true }
rust-embed = { workspace = true, optional = true }
hmac = "0.12"
# KAIROS-T-0384: the host of the URL of a webhook target.
url = { workspace = true }
# The base code index (COLLIERY-T-1853): the split and the assembly of an
# index file, and the update after a push. The summarizer with llama.cpp is
# the feature `llama`.
kairos-index = { path = "../kairos-index" }
# The work folders of the builder, and the tree of a commit from
# `git archive`.
tempfile = "3.14.0"
# The rendered docs sites (KAIROS-T-0404): HTML templates checked at compile
# time (maud, MIT/Apache-2.0), the shared markdown renderer, and the Aurora
# tokens for their colours (no Leptos without the `components` feature).
maud = "0.27"
kairos-markdown = { workspace = true }
aurora-dark = { workspace = true }
# The store of the uploaded repository sites, on disk or in S3
# (KAIROS-T-0405). Apache-2.0; its reqwest is the 0.12 that the server has.
object_store = { version = "0.12", default-features = false, features = ["aws", "fs"] }
bytes = "1"
futures-util = "0.3.31"
# The .tar.gz of a site upload (KAIROS-T-0406).
flate2 = "1"
md-5 = "0.10"
tar = "0.4"

[features]
# Embed the built GUI (crates/kairos-web/dist) into the binary — the
# A-0013 single-artifact release path. OFF by default so plain
# `cargo build` never needs wasm tooling or a prior GUI build. Release
# recipe: `angreal web build --release`, then
# `cargo build -p kairos-server --release --features embed-web`.
embed-web = ["dep:rust-embed"]
# The builder of the base code index writes summaries with llama.cpp and
# Qwen3-4B (COLLIERY-T-1853). Needs cmake and a C++ compiler at build time.
llama = ["kairos-index/llama"]

[dev-dependencies]
# In-process router exercise (`Router::oneshot`) + reading response bodies.
http-body-util = "0.1.3"
tower = { workspace = true, features = ["util"] }
# Real WebSocket client for tests/ws_events.rs (KAIROS-T-0022); same
# version axum's `ws` feature already pulls in, so no duplicate copy.
tokio-tungstenite = "0.29.0"
futures-util = "0.3.31"
# The gzip and tar fixtures of the tools scenarios (COLLIERY-T-2525).
flate2 = "1"
