[package]
name = "kairos-web"
version.workspace = true
edition.workspace = true
license.workspace = true

# Two targets (KAIROS-T-0039):
# - the `kairos-web` bin is what trunk compiles to wasm32-unknown-unknown
#   (`angreal web build` / Trunk.toml);
# - the lib carries the whole app so `cargo build/clippy --workspace` on the
#   host still typechecks every component without any wasm tooling.

[dependencies]
# The binary selects the renderer (A-0015: CSR, no SSR).
leptos = { workspace = true, features = ["csr"] }
leptos_router = { workspace = true }
# Aurora design system (A-0015; light, dark (COLLIERY-T-1836) and hyper (KAIROS-T-0397) themes):
# tokens + components only — see docs/gui-conventions.md for the "tokens
# only, no hardcoded colors" rule.
aurora-dark = { workspace = true, features = ["components"] }
serde = { workspace = true }
serde_json = { workspace = true }
# wasm-side HTTP. kairos-client does not compile to wasm32 (native tokio /
# tokio-tungstenite deps), so the data layer is gloo-net over mirror DTOs —
# decision recorded in docs/gui-conventions.md "Data layer".
gloo-net = { workspace = true }
# Client-side text diff between two history snapshots (KAIROS-T-0044) —
# decision recorded in the task: `similar` over hand-rolled LCS (same
# algorithm family, battle-tested, wasm-clean).
similar = { workspace = true }
# Markdown edit+preview on the item detail page (KAIROS-T-0041); rendered
# client-side by the shared renderer (KAIROS-T-0402).
kairos-markdown = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
# `join!`/`join_all` for the team page's concurrent per-team reads
# (KAIROS-T-0114); pure Rust, wasm-clean, same version the server/client use.
futures-util = "0.3.31"
js-sys = { workspace = true }
console_error_panic_hook = { workspace = true }
web-sys = { workspace = true, features = [
    # window/location/history for redirects and URL parsing (auth.rs)
    "Window",
    "Location",
    "History",
    "Url",
    "UrlSearchParams",
    # sessionStorage carries the PKCE verifier across the IdP redirect
    "Storage",
    # WebCrypto: PKCE verifier entropy + S256 challenge
    "Crypto",
    "SubtleCrypto",
    # /ws/events live updates (T-0040): browser WebSocket + its events
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    # Drag-and-drop card transitions (KAIROS-T-0064)
    "DragEvent",
    "DataTransfer",
    # Markdown toolbar cursor insertion (KAIROS-T-0086)
    "HtmlTextAreaElement",
    # Scroll to the members panel of a board (KAIROS-T-0412)
    "Document",
    "Element",
    # The team tree keeps its open folders across re-renders (KAIROS-T-0437)
    "HtmlDetailsElement",
    # The graph zooms at the pointer (KAIROS-T-0492)
    "DomRect",
    # The editor asks before the tab closes with a dirty draft (KAIROS-T-0581)
    "BeforeUnloadEvent",
    # The preview of a short code reads the pointer and the modifier keys
    "PointerEvent",
    "MouseEvent",
    "KeyboardEvent",
    "EventTarget",
    "Node",
] }
