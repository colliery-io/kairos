# Kairos reference deployment (KAIROS-A-0013, amended by KAIROS-A-0016).
#
# The production-shaped topology: a front door doing TLS termination in front
# of the single Kairos image, backed by Postgres 16 as the sole state. There
# is NO bundled identity provider (KAIROS-A-0016): authentication is any
# spec-compliant OIDC issuer you already run — set OIDC_ISSUER_URL /
# OIDC_AUDIENCE at YOUR IdP (Okta, Entra ID, Auth0, Keycloak, Dex, ...) and
# register Kairos there as an OIDC app (+ optional SCIM app) — or, since
# KAIROS-T-0208, local accounts alone (KAIROS_LOCAL_AUTH=true) with no issuer.
#
# The front door is a compose profile, chosen with COMPOSE_PROFILES in .env
# (KAIROS-T-0209). Exactly one is the normal case; both at once also works:
#   caddy      public HTTPS on the host's 80/443 (Let's Encrypt, subdomain
#              tenants). This was the unconditional default before 0.5.0.
#   tailscale  tailnet-only HTTPS at https://<host>.<tailnet>.ts.net/ with NO
#              host ports at all. See the `tailscale` service below.
# With neither profile, kairos runs but nothing can reach it — the port is
# only `expose`d, on purpose, so that the throttle's trusted-proxy setting
# below stays true.
#
# This is the operator-facing counterpart to the dev/test stack in
# .angreal/docker-compose.yaml (which runs Dex as a fixture and is driven by
# `angreal services up`). That dev profile is deliberately untouched.
#
# Usage:
#   cp deploy/.env.example deploy/.env      # then edit for your deployment
#   docker compose -f deploy/docker-compose.yaml --env-file deploy/.env up -d
#
# Pin KAIROS_VERSION to a published release tag — never `latest`
# (KAIROS-A-0013: reference deployments use versioned tags only).

name: kairos

services:
  caddy:
    image: caddy:2
    # Opt-in since KAIROS-T-0209: COMPOSE_PROFILES=caddy in .env. An .env from
    # before that has no COMPOSE_PROFILES line, so Caddy does not start — loud
    # (nothing answers on 443) and a one-line fix.
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # The Caddyfile templates its site address from this (a hostname gets
      # automatic HTTPS; ":80" is a local no-TLS trial). `:-` rather than `:?`
      # because compose interpolates the whole file even for services whose
      # profile is off, and a tailnet-only deployment has no site address.
      # Left empty with the caddy profile on, Caddy refuses its own Caddyfile
      # at startup, which is the right place for that failure.
      KAIROS_SITE_ADDRESS: ${KAIROS_SITE_ADDRESS:-}
    depends_on:
      kairos:
        condition: service_healthy

  kairos:
    # Never `latest` (KAIROS-A-0013) — pin to a published release tag.
    image: ghcr.io/colliery-io/kairos:${KAIROS_VERSION:?pin KAIROS_VERSION to a published release tag, never latest}
    restart: unless-stopped
    # No `init: true` (KAIROS-T-0336): from 0.11 the image has its own init.
    # tini is PID 1: it reaps the orphaned children (the curl of the
    # healthcheck, the git of the code index builder) and sends SIGTERM on
    # to kairos-server. An image before 0.11 needs `init: true` here.
    # The anchor gives the same settings to the `worker` service below.
    environment: &kairos_env
      DATABASE_URL: postgres://kairos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/kairos
      # Identity is external (KAIROS-A-0016): point these at YOUR IdP. Both
      # are optional ONLY when KAIROS_LOCAL_AUTH is on (KAIROS-T-0208); the
      # server enforces that at boot with a message naming the variable, so
      # the compose file does not `:?` them — it could not know whether local
      # auth is on, and a hard requirement here made the one deployment
      # KAIROS-I-0018 exists for impossible to express.
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      KAIROS_WEB_CLIENT_ID: ${KAIROS_WEB_CLIENT_ID:-kairos-web}
      # Both of these are OPTIONAL in general and MANDATORY for Google /
      # Google Workspace (KAIROS-T-0177): its access tokens are opaque, so
      # the API must validate the id_token instead, and its "Web
      # application" OAuth clients reject the code exchange without a
      # secret even under PKCE. Absent, the server silently falls back and
      # the operator sees a login that does not work.
      KAIROS_API_BEARER: ${KAIROS_API_BEARER:-}
      KAIROS_WEB_CLIENT_SECRET: ${KAIROS_WEB_CLIENT_SECRET:-}
      # Tenant addressing: wildcard subdomains (acme.<base> -> tenant acme),
      # or pin one tenant for single-tenant installs (leave the other empty).
      KAIROS_BASE_DOMAIN: ${KAIROS_BASE_DOMAIN:-}
      KAIROS_SINGLE_TENANT: ${KAIROS_SINGLE_TENANT:-}
      KAIROS_SINGLE_TENANT_NAME: ${KAIROS_SINGLE_TENANT_NAME:-}
      KAIROS_AUTO_JOIN_DOMAINS: ${KAIROS_AUTO_JOIN_DOMAINS:-}
      KAIROS_DEPLOYMENT_ADMINS: ${KAIROS_DEPLOYMENT_ADMINS:-}
      # Forge webhooks: the public base URL of this deployment, and the key
      # that each webhook secret is derived from. Both empty: the feature is
      # off.
      KAIROS_PUBLIC_URL: ${KAIROS_PUBLIC_URL:-}
      KAIROS_WEBHOOK_SIGNING_KEY: ${KAIROS_WEBHOOK_SIGNING_KEY:-}
      # API keys and agent keys: the default life of a new key, and how long
      # the old secret of a rotated key works.
      KAIROS_API_KEY_TTL_DAYS: ${KAIROS_API_KEY_TTL_DAYS:-}
      # KAIROS-T-0531: a claim with no write for this many days is reported.
      KAIROS_STALE_CLAIM_DAYS: ${KAIROS_STALE_CLAIM_DAYS:-}
      # KAIROS-T-0737: the notices of one key in one hour.
      KAIROS_NOTICE_LIMIT_PER_HOUR: ${KAIROS_NOTICE_LIMIT_PER_HOUR:-}
      # KAIROS-T-0608, KAIROS-T-0614: the database pools of the server.
      KAIROS_POOL_SIZE: ${KAIROS_POOL_SIZE:-}
      KAIROS_POOL_MIN_IDLE: ${KAIROS_POOL_MIN_IDLE:-}
      KAIROS_JOB_POOL_SIZE: ${KAIROS_JOB_POOL_SIZE:-}
      KAIROS_API_KEY_ROTATION_GRACE_SECS: ${KAIROS_API_KEY_ROTATION_GRACE_SECS:-}
      KAIROS_BIND_ADDR: 0.0.0.0:8080
      # KAIROS-T-0394: `all` (the default) serves the API and runs the code
      # index builds. With the `worker` profile on, set `api` in .env: the
      # worker then runs the builds, and a build that runs out of memory
      # ends the worker only.
      KAIROS_ROLE: ${KAIROS_ROLE:-all}
      KAIROS_LOG_FORMAT: json
      KAIROS_LOG_LEVEL: ${KAIROS_LOG_LEVEL:-info}
      # KAIROS-T-0196: OTLP/HTTP traces endpoint (note :4318, not gRPC :4317).
      # Unset means no tracing at all.
      KAIROS_OTEL_ENDPOINT: ${KAIROS_OTEL_ENDPOINT:-}
      KAIROS_OTEL_SAMPLE_RATIO: ${KAIROS_OTEL_SAMPLE_RATIO:-}
      # KAIROS-T-0202: failed-authentication throttling. The defaults suit a
      # small deployment; 0 failures turns throttling off.
      KAIROS_AUTH_MAX_FAILURES: ${KAIROS_AUTH_MAX_FAILURES:-}
      KAIROS_AUTH_FAILURE_WINDOW_SECS: ${KAIROS_AUTH_FAILURE_WINDOW_SECS:-}
      KAIROS_AUTH_LOCKOUT_SECS: ${KAIROS_AUTH_LOCKOUT_SECS:-}
      # KAIROS-T-0609: how long the auth cache keeps an entry; 0 turns it off.
      KAIROS_AUTH_CACHE_SECS: ${KAIROS_AUTH_CACHE_SECS:-}
      # KAIROS-T-0613: the request timeout of /api and /mcp; 0 turns it off.
      KAIROS_REQUEST_TIMEOUT_SECS: ${KAIROS_REQUEST_TIMEOUT_SECS:-}
      # Hard-coded, like KAIROS_BIND_ADDR above, because it is a fact about THIS
      # topology rather than a choice: the kairos service only `expose`s 8080, so
      # every request arrives through a front door — Caddy, or `tailscale serve`
      # in the tailscale profile — and both append the peer they saw to
      # X-Forwarded-For. Without this the throttle would count every client in
      # the world as one source — the proxy's — and one clumsy client could lock
      # out everybody. Do NOT copy this line into a stack that publishes port 8080.
      KAIROS_TRUSTED_PROXY: "true"
      # KAIROS-T-0203: local password accounts. OFF by default — with it off,
      # /api/login is not routed at all, so there is no password endpoint to
      # attack. Additive: a deployment may have both an issuer and local accounts.
      KAIROS_LOCAL_AUTH: ${KAIROS_LOCAL_AUTH:-}
      KAIROS_SESSION_TTL_SECS: ${KAIROS_SESSION_TTL_SECS:-}
      # KAIROS-T-0204: the first-boot admin. SINGLE-USE — consumed only on a boot
      # that finds no users at all, and inert afterwards. Remove both once it has
      # been consumed: they are a credential sitting in your .env and doing nothing.
      # Prefer the HASH form (`kairos-server hash-password`) so the plaintext is
      # never in a file.
      KAIROS_BOOTSTRAP_ADMIN: ${KAIROS_BOOTSTRAP_ADMIN:-}
      KAIROS_BOOTSTRAP_PASSWORD: ${KAIROS_BOOTSTRAP_PASSWORD:-}
      KAIROS_BOOTSTRAP_PASSWORD_HASH: ${KAIROS_BOOTSTRAP_PASSWORD_HASH:-}
      # COLLIERY-T-1853: the base code index builder. Empty turns it off. The
      # first start downloads about 2.7 GB of tools into this folder.
      KAIROS_CODE_INDEX_DIR: ${KAIROS_CODE_INDEX_DIR:-}
      KAIROS_CODE_INDEX_POLL_SECS: ${KAIROS_CODE_INDEX_POLL_SECS:-}
      KAIROS_CODE_INDEX_THREADS: ${KAIROS_CODE_INDEX_THREADS:-}
      KAIROS_CODE_INDEX_MIN_REBUILD_SECS: ${KAIROS_CODE_INDEX_MIN_REBUILD_SECS:-}
      # 0.14: the dependency caches of the Go, TypeScript and Python runners.
      KAIROS_CODE_INDEX_DEPS_CAP_MB: ${KAIROS_CODE_INDEX_DEPS_CAP_MB:-}
      KAIROS_CODE_INDEX_MIN_FREE_MB: ${KAIROS_CODE_INDEX_MIN_FREE_MB:-}
      KAIROS_CODE_INDEX_DEPS_ENV: ${KAIROS_CODE_INDEX_DEPS_ENV:-}
      KAIROS_CODE_INDEX_TOOL_DOWNLOADS: ${KAIROS_CODE_INDEX_TOOL_DOWNLOADS:-}
      # COLLIERY-T-3105: encrypts the read token of each repository. Keep it
      # with the database password; a lost key means every token is set again.
      # The old keys go in _OLD during a rotation (`kairos-server rotate-secrets`).
      KAIROS_SECRETS_KEY: ${KAIROS_SECRETS_KEY:-}
      KAIROS_SECRETS_KEY_OLD: ${KAIROS_SECRETS_KEY_OLD:-}
      # Retention (KAIROS-A-0004). These defaults are the server's own, and
      # scripts/check_compose_settings.py holds them to the book: the server
      # reads an EMPTY retention value as an error, not as unset, so the
      # empty default the other settings use would stop the start.
      KAIROS_HISTORY_HOT_DAYS: ${KAIROS_HISTORY_HOT_DAYS:-90}
      KAIROS_HISTORY_KEEP_LATEST: ${KAIROS_HISTORY_KEEP_LATEST:-5}
      KAIROS_ACTIVITY_RETENTION_DAYS: ${KAIROS_ACTIVITY_RETENTION_DAYS:-365}
      KAIROS_ARCHIVE_TARGET: ${KAIROS_ARCHIVE_TARGET:-}
      KAIROS_ARCHIVE_S3_ENDPOINT: ${KAIROS_ARCHIVE_S3_ENDPOINT:-}
      KAIROS_ARCHIVE_S3_REGION: ${KAIROS_ARCHIVE_S3_REGION:-}
      KAIROS_NOTIFICATIONS_READ_DAYS: ${KAIROS_NOTIFICATIONS_READ_DAYS:-30}
      KAIROS_NOTIFICATIONS_UNREAD_DAYS: ${KAIROS_NOTIFICATIONS_UNREAD_DAYS:-180}
      KAIROS_CODE_INDEX_POOL_DAYS: ${KAIROS_CODE_INDEX_POOL_DAYS:-30}
      KAIROS_CODE_INDEX_KEEP: ${KAIROS_CODE_INDEX_KEEP:-5}
      KAIROS_RETENTION_MODE: ${KAIROS_RETENTION_MODE:-archive}
      # The job queue (KAIROS-T-0373): the lease of a job, and how many jobs
      # of each kind ONE server runs at the same time.
      KAIROS_JOB_HEARTBEAT_SECS: ${KAIROS_JOB_HEARTBEAT_SECS:-}
      KAIROS_JOB_LEASE_SECS: ${KAIROS_JOB_LEASE_SECS:-}
      KAIROS_JOB_MAX_TRIES: ${KAIROS_JOB_MAX_TRIES:-}
      KAIROS_JOB_LIMIT_EMBEDDED_BUILD: ${KAIROS_JOB_LIMIT_EMBEDDED_BUILD:-}
      KAIROS_JOB_LIMIT_HOSTED_BUILD: ${KAIROS_JOB_LIMIT_HOSTED_BUILD:-}
      KAIROS_JOB_LIMIT_EMBEDDING_BATCH: ${KAIROS_JOB_LIMIT_EMBEDDING_BATCH:-}
      KAIROS_JOB_LIMIT_PERIODIC: ${KAIROS_JOB_LIMIT_PERIODIC:-}
      KAIROS_JOB_LIMIT_WEBHOOK_DELIVERY: ${KAIROS_JOB_LIMIT_WEBHOOK_DELIVERY:-}
      KAIROS_JOB_LIMIT_GITHUB_WRITEBACK: ${KAIROS_JOB_LIMIT_GITHUB_WRITEBACK:-}
      KAIROS_JOB_LIMIT_ISSUE_IMPORT: ${KAIROS_JOB_LIMIT_ISSUE_IMPORT:-}
      KAIROS_JOB_LIMIT_ISSUE_WRITEBACK: ${KAIROS_JOB_LIMIT_ISSUE_WRITEBACK:-}
      # Webhook deliveries (KAIROS-T-0384): the tries and the waits.
      KAIROS_WEBHOOK_MAX_TRIES: ${KAIROS_WEBHOOK_MAX_TRIES:-}
      KAIROS_WEBHOOK_RETRY_BASE_SECS: ${KAIROS_WEBHOOK_RETRY_BASE_SECS:-}
      KAIROS_WEBHOOK_TIMEOUT_SECS: ${KAIROS_WEBHOOK_TIMEOUT_SECS:-}
      KAIROS_WEBHOOK_DISABLE_AFTER: ${KAIROS_WEBHOOK_DISABLE_AFTER:-}
      KAIROS_WEBHOOK_ALLOW_PRIVATE: ${KAIROS_WEBHOOK_ALLOW_PRIVATE:-}
      # GitHub Enterprise Server: `https://<host>/api/v3`. Empty is github.com.
      KAIROS_GITHUB_API_URL: ${KAIROS_GITHUB_API_URL:-}
      # A mirror of the CLI tarballs for `kairos self-update`.
      KAIROS_CLI_DOWNLOAD_URL: ${KAIROS_CLI_DOWNLOAD_URL:-}
      # KAIROS-T-0409: the store of the sites that repositories publish
      # (KAIROS-D-0012). `disk` keeps them in the volume below; set `s3` and
      # the KAIROS_PAGES_S3_* variables for a bucket instead.
      KAIROS_PAGES_STORE: ${KAIROS_PAGES_STORE:-disk}
      KAIROS_PAGES_DIR: /var/lib/kairos/pages
      KAIROS_PAGES_S3_BUCKET: ${KAIROS_PAGES_S3_BUCKET:-}
      KAIROS_PAGES_S3_PREFIX: ${KAIROS_PAGES_S3_PREFIX:-}
      KAIROS_PAGES_S3_ENDPOINT: ${KAIROS_PAGES_S3_ENDPOINT:-}
      KAIROS_PAGES_S3_REGION: ${KAIROS_PAGES_S3_REGION:-}
    volumes:
      - code_index:/var/lib/kairos/code-index
      - kairos_pages:/var/lib/kairos/pages
    # The image applies pending migrations on boot (KAIROS-T-0007) before it
    # binds, so no separate migrate step is required. Liveness is the image's
    # own HEALTHCHECK against /healthz.
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  # The code index worker (KAIROS-T-0394, KAIROS-A-0027). Opt-in:
  # COMPOSE_PROFILES=worker (with your front door, e.g. caddy,worker) and
  # KAIROS_ROLE=api in .env for the kairos service. The same image with
  # KAIROS_ROLE=worker: it runs only the code index builds and the
  # new-commits sweep, and serves only /healthz, /readyz, /version and
  # /metrics. It applies the migrations at start like the server, under the
  # same lock, so the two can start together.
  #
  # The limits are for the builder. GitHub #34: a full build with the
  # embedded summary model of a repository of about 1,200 files used about
  # 6.3 GiB at its peak, and 4 cores. Raise mem_limit for big repositories.
  # A build that runs out of memory ends this container only: the API keeps
  # serving, Docker starts the worker again, and the breaker of the
  # repository (KAIROS-T-0399) stops the build until a person asks again.
  worker:
    image: ghcr.io/colliery-io/kairos:${KAIROS_VERSION:?pin KAIROS_VERSION to a published release tag, never latest}
    profiles: ["worker"]
    restart: unless-stopped
    environment:
      <<: *kairos_env
      KAIROS_ROLE: worker
      # The worker needs its folder (KAIROS-T-0466): the volume below, unless
      # .env names another.
      KAIROS_CODE_INDEX_DIR: ${KAIROS_CODE_INDEX_DIR:-/var/lib/kairos/code-index}
    mem_limit: 8g
    mem_reservation: 2g
    cpus: 4
    volumes:
      # Its own clones and tools (about 2.7 GB on the first start).
      - code_index_worker:/var/lib/kairos/code-index
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  # The tailnet front door (KAIROS-T-0209): a Tailscale node that shares the
  # kairos container's network namespace, so `https://<host>.<tailnet>.ts.net/`
  # reaches kairos from any device on the tailnet — with WireGuard doing the
  # encryption and NAT traversal (direct where it can punch, DERP relay where
  # it cannot) and NO port published on the host or the LAN.
  #
  # Opt-in: COMPOSE_PROFILES=tailscale and a TAILSCALE_AUTHKEY in .env. State
  # persists in the volume, so the auth key is used once and can be single-use;
  # disable key expiry for the node in the admin console.
  tailscale:
    image: tailscale/tailscale:latest
    profiles: ["tailscale"]
    network_mode: "service:kairos"
    depends_on:
      kairos:
        condition: service_started
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY:-}
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-kairos}
      TS_STATE_DIR: /var/lib/tailscale
      # Kernel (tun) mode: kairos listens on 0.0.0.0 in the shared namespace,
      # so inbound tailnet traffic reaches it directly.
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: ${TAILSCALE_EXTRA_ARGS:-}
      # Serve kairos on the tailnet name with no port. tailscaled terminates
      # TLS with a Let's Encrypt cert for the node and proxies to
      # 127.0.0.1:8080, which reaches kairos because this sidecar shares its
      # network namespace.
      #
      # Declared here rather than left to a one-off `tailscale serve` command:
      # that persists in the state volume and so survives restarts, but a
      # fresh deploy would silently not have it.
      #
      # **serve, not funnel** — `tailscale serve status` must keep saying
      # "tailnet only". Funnel would publish this to the public internet.
      #
      # Port 80 is a signpost, not a second door: it lands on the nginx below,
      # which 301s to https. A plain-HTTP origin is not a secure context, and
      # the GUI's PKCE login needs WebCrypto, which browsers withhold there.
      #
      # Requires "HTTPS Certificates" enabled for the tailnet, which is also
      # what makes `${TS_CERT_DOMAIN}` in serve.json resolve — with certs off
      # it substitutes the literal string `no-https` and nothing matches.
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale:/config:ro
    restart: unless-stopped

  # Turns the plain-HTTP tailnet door into a redirect instead of a second
  # entrance, so the bare hostname works without handing anyone an insecure
  # origin. Its own listener rather than a branch inside kairos because
  # `tailscale serve` forwards X-Forwarded-For and X-Forwarded-Host but NOT
  # X-Forwarded-Proto (measured on skadi, 2026-09-26), so :80 and :443 traffic
  # is indistinguishable once it reaches kairos. The port is the only signal,
  # which means :80 must land somewhere that is not kairos's :8080.
  #
  # Shares kairos's namespace like the tailscale sidecar, so tailscaled reaches
  # it on loopback and it is never exposed on the host or the LAN.
  tailscale-http-redirect:
    image: nginx:1.27-alpine
    profiles: ["tailscale"]
    network_mode: "service:kairos"
    depends_on:
      kairos:
        condition: service_started
    volumes:
      - ./tailscale/redirect.conf:/etc/nginx/conf.d/default.conf:ro
    # 6.7 MiB idle measured for this exact image doing this exact job (skadi,
    # 2026-09-26); 32m is ~5x that.
    mem_limit: 32m
    restart: unless-stopped

  # Scheduled database backup (COLLIERY-T-0229), after skadi's SKADI-T-0481.
  #
  # Postgres is the sole state of a deployment (KAIROS-A-0013) and nothing
  # backed it up on a schedule: the book describes `pg_dump`, and leaves running
  # it to the operator. On 2026-09-27 a second PostgreSQL was started on a live
  # deployment's data directory (COLLIERY-T-0226) and there was no backup to
  # fall back on. The data survived. It should not have depended on that.
  #
  # The same image as the server, so `pg_dump` is the server's version exactly.
  # A newer client can read an older server, an older client cannot read a newer
  # one, and pinning the two together removes the question.
  #
  # Writes to a HOST directory, not a named volume: a backup that lives in the
  # same Docker volume set as the thing it protects is not a backup. Whatever
  # took the volume would take it too.
  #
  # Not behind a profile. A deployment that points DATABASE_URL at a managed
  # instance should take that provider's backups instead and can scale this
  # service to zero; the default has to be the safe one.
  postgres-backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: kairos
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: kairos
      # Seconds between dumps, and how many verified dumps to keep.
      BACKUP_INTERVAL: ${KAIROS_BACKUP_INTERVAL:-21600}
      BACKUP_KEEP: ${KAIROS_BACKUP_KEEP:-4}
    volumes:
      - ${KAIROS_BACKUP_DIR:-./backups}:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        while :; do
          stamp="$$(date -u +%Y%m%dT%H%M%SZ)"
          out="/backups/kairos-$$stamp.dump"
          # Dump to a .partial name and rename on success. A dump interrupted
          # by a restart would otherwise sit in the directory looking like a
          # valid backup, and the retention sweep below would delete a good
          # older one to make room for it.
          if pg_dump -Fc -Z 9 -f "$$out.partial" 2>/tmp/pgdump.err; then
            # `pg_restore -l` parses the archive's table of contents, so a
            # truncated or corrupt file fails here rather than on the day it
            # is needed.
            if pg_restore -l "$$out.partial" >/dev/null 2>&1; then
              mv "$$out.partial" "$$out"
              echo "backup ok: $$out ($$(wc -c < "$$out") bytes)"
              # Retention: keep the newest N verified dumps. INSIDE the
              # success branch, so a failed run never prunes: a week of
              # failures must not eat the last good backup. The directory
              # holds N+1 for the moment between the rename and the prune,
              # and N at rest.
              ls -1t /backups/kairos-*.dump 2>/dev/null \
                | tail -n +$$((BACKUP_KEEP + 1)) \
                | while read -r old; do
                    echo "pruning $$old"
                    rm -f "$$old"
                  done
            else
              echo "backup FAILED verification, discarding: $$out.partial" >&2
              rm -f "$$out.partial"
            fi
          else
            echo "pg_dump failed:" >&2
            cat /tmp/pgdump.err >&2
            rm -f "$$out.partial"
          fi
          sleep "$$BACKUP_INTERVAL"
        done

  postgres:
    # pgvector/pgvector:pg16 is stock postgres:16 with pgvector added.
    # KAIROS-A-0021 rule 2 requires the extension (KAIROS-T-0187); a plain
    # postgres:16 here cannot run Kairos's migrations. Pointing `DATABASE_URL`
    # at a managed instance instead is still supported — RDS, Cloud SQL and
    # Azure all offer pgvector.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: kairos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    # COLLIERY-I-0550: the database since 2026-10-04. The volume before it,
    # kairos_postgres_data, is kept as the archive of the old database.
    name: kairos_postgres_data_v2
  caddy_data:
  caddy_config:
  # The tailnet node's identity. Losing it means re-authenticating and a new
  # node in the admin console; back it up alongside postgres_data.
  tailscale_state:
  # Clones and tools of the code index builder. It can be made again, so it
  # needs no backup.
  code_index:
  # The clones and tools of the worker (KAIROS-T-0394). It can be made
  # again, so it needs no backup.
  code_index_worker:
  # KAIROS-T-0409: the published repository sites. CI can publish them again,
  # so they need no backup.
  kairos_pages:
