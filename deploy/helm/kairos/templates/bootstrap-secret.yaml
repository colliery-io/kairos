{{- include "kairos.validateBootstrap" . -}}
{{- if and .Values.config.localAuth.bootstrapPasswordHash (not .Values.config.localAuth.bootstrapPasswordExistingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-bootstrap" (include "kairos.fullname" .) }}
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The first-boot admin's password, as a PHC hash (KAIROS-T-0204). A hash rather
  # than a plaintext because a manifest is not a safe place for a password: a hash
  # here is not a login, and `kairos-server hash-password` produces it without the
  # plaintext ever reaching a file.
  #
  # It is still a credential. Once the account exists, remove this and
  # config.localAuth.bootstrapAdmin: the mechanism is single-use, so they do nothing
  # on a later boot, and what remains is an unused secret in your release history.
  KAIROS_BOOTSTRAP_PASSWORD_HASH: {{ .Values.config.localAuth.bootstrapPasswordHash | quote }}
{{- end }}
