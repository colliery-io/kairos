{{- include "kairos.validateTenancy" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kairos.fullname" . }}
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
data:
  {{- /*
  Identity is the operator's (KAIROS-A-0016) — unless they asked the chart for a
  bundled Dex, in which case the issuer and the audience are this release's own
  (KAIROS-T-0200). `required` still applies when there is no bundle, so a
  deployment that names neither an issuer nor a Dex still fails loudly.
  */}}
  {{- if include "kairos.dexEnabled" . }}
  OIDC_ISSUER_URL: {{ include "kairos.dexIssuerUrl" . | quote }}
  {{- else }}
  OIDC_ISSUER_URL: {{ required "config.oidc.issuerUrl is required (KAIROS-A-0016: bring your own OIDC issuer), or leave it empty to use the bundled Dex" .Values.config.oidc.issuerUrl | quote }}
  {{- end }}
  {{- $audience := .Values.config.oidc.audience }}
  {{- if and (not $audience) (include "kairos.dexEnabled" .) }}
  {{- /* The bundled Dex mints tokens for the GUI and CLI clients only. */}}
  {{- $audience = list .Values.config.webClientId "kairos-cli" }}
  {{- end }}
  {{- $audience = required "config.oidc.audience is required (the OAuth client id / API audience, or a list of them — KAIROS-T-0055)" $audience }}
  {{- /* A list renders as the comma-separated form the server parses. */}}
  OIDC_AUDIENCE: {{ if kindIs "slice" $audience }}{{ join "," $audience | quote }}{{ else }}{{ $audience | quote }}{{ end }}
  KAIROS_WEB_CLIENT_ID: {{ .Values.config.webClientId | quote }}
  # Which token the GUI/CLI present as the API bearer (KAIROS-T-0054): set
  # "id_token" for opaque-access-token issuers such as Google Workspace.
  KAIROS_API_BEARER: {{ .Values.config.apiBearer | quote }}
  # The container listens on all interfaces inside the pod (server default is
  # 127.0.0.1) so kubelet probes and the Service can reach it.
  KAIROS_BIND_ADDR: {{ printf "0.0.0.0:%d" (int .Values.containerPort) | quote }}
  # Tenant addressing (KAIROS-A-0005 §2): exactly one is set (guard above).
  {{- with .Values.config.tenancy.baseDomain }}
  KAIROS_BASE_DOMAIN: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.tenancy.singleTenant }}
  KAIROS_SINGLE_TENANT: {{ . | quote }}
  {{- end }}
  KAIROS_DEPLOYMENT_ADMINS: {{ .Values.config.deploymentAdmins | quote }}
  KAIROS_LOG_LEVEL: {{ .Values.config.log.level | quote }}
  KAIROS_LOG_FORMAT: {{ .Values.config.log.format | quote }}
  KAIROS_DEV_UI: {{ .Values.config.devUi | quote }}
  {{- with .Values.config.otel.endpoint }}
  KAIROS_OTEL_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.otel.sampleRatio }}
  KAIROS_OTEL_SAMPLE_RATIO: {{ . | quote }}
  {{- end }}
  # Failed-authentication throttling (KAIROS-T-0202). Only overrides are
  # emitted; unset keys fall back to the server's defaults.
  {{- with include "kairos.setValue" .Values.config.auth.maxFailures }}
  KAIROS_AUTH_MAX_FAILURES: {{ . | quote }}
  {{- end }}
  {{- with include "kairos.setValue" .Values.config.auth.failureWindowSecs }}
  KAIROS_AUTH_FAILURE_WINDOW_SECS: {{ . | quote }}
  {{- end }}
  {{- with include "kairos.setValue" .Values.config.auth.lockoutSecs }}
  KAIROS_AUTH_LOCKOUT_SECS: {{ . | quote }}
  {{- end }}
  # Whether X-Forwarded-For is trusted. Unset FOLLOWS THE INGRESS, because that
  # is what decides the answer: behind the chart's Ingress the socket peer is
  # the ingress controller, so counting it would pool every client into one
  # bucket; with no Ingress there is nothing in front and the header is
  # caller-supplied. An explicit value wins, for a gateway of your own.
  KAIROS_TRUSTED_PROXY: {{ include "kairos.trustedProxy" . | quote }}
  # Retention (KAIROS-A-0004): only overrides are emitted; unset keys fall back
  # to the server's built-in defaults.
  {{- with .Values.config.retention.historyHotDays }}
  KAIROS_HISTORY_HOT_DAYS: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.retention.historyKeepLatest }}
  KAIROS_HISTORY_KEEP_LATEST: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.retention.activityRetentionDays }}
  KAIROS_ACTIVITY_RETENTION_DAYS: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.retention.archiveTarget }}
  KAIROS_ARCHIVE_TARGET: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.retention.mode }}
  KAIROS_RETENTION_MODE: {{ . | quote }}
  {{- end }}
  {{/*
  Semantic retrieval (KAIROS-A-0021, KAIROS-T-0188). All optional: the local
  model ships inside the image, so an unset block means retrieval works without
  any of this. KAIROS_EMBED_API_KEY is NOT here — it is a secret, and lives in
  the Secret beside DATABASE_URL.
  */}}
  {{- with .Values.embeddings.provider }}
  KAIROS_EMBED_PROVIDER: {{ . | quote }}
  {{- end }}
  {{- with .Values.embeddings.url }}
  KAIROS_EMBED_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.embeddings.model }}
  KAIROS_EMBED_MODEL: {{ . | quote }}
  {{- end }}
