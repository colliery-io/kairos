{{- include "kairos.validateTenancy" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kairos.fullname" . }}
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kairos.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the non-secret config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kairos.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kairos.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kairos
          image: {{ include "kairos.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            # Non-secret env surface (KAIROS-A-0013).
            - configMapRef:
                name: {{ include "kairos.fullname" . }}
          env:
            # DATABASE_URL is a secret (KAIROS-A-0013: sole state). Sourced from
            # the chart-rendered Secret or database.existingSecret.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "kairos.databaseSecretName" . }}
                  key: {{ include "kairos.databaseSecretKey" . }}
            {{- if include "kairos.embedSecretEnabled" . }}
            # The embedding endpoint's API key (KAIROS-T-0188): a secret, sourced
            # the same way DATABASE_URL is.
            - name: KAIROS_EMBED_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kairos.embedSecretName" . }}
                  key: {{ include "kairos.embedSecretKey" . }}
            {{- end }}
            {{- if include "kairos.webClientSecretEnabled" . }}
            # Confidential GUI client secret (KAIROS-T-0056): Google Workspace
            # and other confidential OIDC clients require it at the token relay.
            - name: KAIROS_WEB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "kairos.webClientSecretName" . }}
                  key: {{ include "kairos.webClientSecretKey" . }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- omit .Values.startupProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
