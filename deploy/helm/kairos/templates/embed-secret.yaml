{{- if and (include "kairos.embedSecretEnabled" .) (not .Values.embeddings.existingSecret) }}
{{/*
The OpenAI-compatible endpoint's API key (KAIROS-T-0188, moved from
KAIROS-T-0189). Handled exactly like DATABASE_URL — inline here, or an existing
Secret — because it is the same kind of thing and an operator who has learned one
pattern should not have to learn a second.

Only rendered when a key is actually configured: the local model needs none, and
a local Ollama needs none either.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kairos.embedSecretName" . }}
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
type: Opaque
stringData:
  KAIROS_EMBED_API_KEY: {{ .Values.embeddings.apiKey | quote }}
{{- end }}
