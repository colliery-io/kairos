{{- if .Values.ingress.enabled -}}
{{- include "kairos.validateTenancy" . -}}
{{- $fullName := include "kairos.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $path := .Values.ingress.path -}}
{{- $pathType := .Values.ingress.pathType -}}
{{/*
Resolve the host set from the tenancy mode:
  wildcard -> the apex baseDomain AND *.baseDomain (subdomain tenancy, A-0005 §2)
  single   -> the single ingress.host
*/}}
{{- $base := .Values.config.tenancy.baseDomain | default "" -}}
{{- $hosts := list -}}
{{- if eq .Values.ingress.tenancyMode "wildcard" -}}
  {{- if not $base -}}
  {{- fail "ingress.tenancyMode=wildcard requires config.tenancy.baseDomain to be set." -}}
  {{- end -}}
  {{- $hosts = list $base (printf "*.%s" $base) -}}
{{- else if eq .Values.ingress.tenancyMode "single" -}}
  {{- if not .Values.ingress.host -}}
  {{- fail "ingress.tenancyMode=single requires ingress.host to be set." -}}
  {{- end -}}
  {{- $hosts = list .Values.ingress.host -}}
{{- else -}}
  {{- fail "ingress.tenancyMode must be \"wildcard\" or \"single\"." -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $path }}
            pathType: {{ $pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
    {{- end }}
{{- end }}
