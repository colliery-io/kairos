{{- include "kairos.validateDatabase" . -}}
{{- if not (include "kairos.postgresqlEnabled" .) }}
{{- if not .Values.database.existingSecret }}
{{- if not .Values.database.url }}
{{- fail "database: set EITHER database.url (inline) OR database.existingSecret, or leave both empty and set postgresql.enabled=true for the bundled evaluation database. DATABASE_URL is required to reach PostgreSQL (KAIROS-A-0013)." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kairos.databaseSecretName" . }}
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The connection string for the external PostgreSQL (KAIROS-A-0013: sole
  # state). For production, prefer database.existingSecret to keep this out of
  # values/release history.
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
{{- end }}
