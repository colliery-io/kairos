apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kairos.fullname" . }}-test-connection
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: healthz
      image: curlimages/curl:8.10.1
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
      command:
        - curl
      args:
        - --fail
        - --silent
        - --show-error
        - http://{{ include "kairos.fullname" . }}:{{ .Values.service.port }}/healthz
