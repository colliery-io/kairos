{{- if and .Values.config.webClientSecret (not .Values.config.webClientSecretExistingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-webauth" (include "kairos.fullname" .) }}
  labels:
    {{- include "kairos.labels" . | nindent 4 }}
type: Opaque
stringData:
  # OAuth client secret for a confidential GUI client (KAIROS-T-0056). The
  # server-side token relay presents it on the code/refresh exchange; it never
  # reaches the browser. For production, prefer config.webClientSecretExistingSecret
  # to keep this out of values/release history.
  KAIROS_WEB_CLIENT_SECRET: {{ .Values.config.webClientSecret | quote }}
{{- end }}
