# Default values for the Kairos Helm chart.
# This is a YAML-formatted file. Override any of these with `-f my-values.yaml`
# or `--set key=value` on `helm install` / `helm upgrade`.
#
# Kairos is ONE stateless binary that serves the GUI (/), REST API (/api), MCP
# (/mcp), SCIM (/scim/v2), and the ops endpoints (/healthz, /readyz, /metrics)
# from a single container (KAIROS-A-0015). It requires two things this chart does
# NOT provide (KAIROS-A-0016): an external PostgreSQL and an external OIDC issuer.

# -- Number of server replicas. The server is stateless (all state is in
# Postgres, KAIROS-A-0013), so it scales horizontally. Ignored when
# autoscaling.enabled is true.
replicaCount: 2

image:
  # -- Image repository. The release image published by CI (KAIROS-T-0047).
  repository: ghcr.io/colliery-io/kairos
  # -- Image tag. LEAVE EMPTY to track the chart's appVersion (recommended —
  # the chart never pins `latest`, per KAIROS-A-0013). Set explicitly to run a
  # specific published release, e.g. "0.3.0".
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Secrets for pulling from a private registry, e.g. [{name: ghcr-creds}].
imagePullSecrets: []

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the fully-qualified release name used in resource names.
fullnameOverride: ""

serviceAccount:
  # -- Create a dedicated ServiceAccount for the pods.
  create: true
  # -- Name of the ServiceAccount. Empty uses the generated fullname (when
  # create is true) or "default" (when create is false).
  name: ""
  # -- Annotations for the ServiceAccount (e.g. IRSA / Workload Identity roles).
  annotations: {}
  # -- Auto-mount the SA token. Kairos does not call the Kubernetes API; leave
  # false unless a sidecar or admission integration needs it.
  automountServiceAccountToken: false

# -- Extra annotations for the pods (e.g. checksum triggers, mesh config).
podAnnotations: {}
# -- Extra labels for the pods.
podLabels: {}

# -- Pod-level security context. Runs as an unprivileged, non-root user with a
# fixed fsGroup and a seccomp profile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context. Drops all capabilities, disallows
# privilege escalation, and mounts the root filesystem read-only (the server
# writes no local files — Postgres is the sole state, KAIROS-A-0013). If your
# KAIROS_ARCHIVE_TARGET is a local filesystem path, mount a writable volume via
# extraVolumes/extraVolumeMounts and it can coexist with a read-only rootfs.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# -- CPU/memory requests and limits. Sane starting point for a single-node-ish
# workload; tune with observed usage. No memory limit surprises: request==floor.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

service:
  # -- Service type. ClusterIP + an Ingress is the intended topology.
  type: ClusterIP
  # -- Service port (what the Service exposes in-cluster).
  port: 80
  # -- Annotations for the Service.
  annotations: {}

# -- The container's listen port. The chart sets KAIROS_BIND_ADDR to
# 0.0.0.0:<containerPort> so the server listens on all interfaces inside the
# pod (its own default is 127.0.0.1:8080). Also the Service targetPort.
containerPort: 8080

ingress:
  # -- Create an Ingress. Disable to front Kairos with your own gateway.
  enabled: false
  # -- IngressClass (e.g. "nginx", "traefik"). Empty uses the cluster default.
  className: ""
  # -- Ingress annotations. For cert-manager TLS, set e.g.
  # cert-manager.io/cluster-issuer: letsencrypt-prod
  annotations: {}
  # -- Tenancy mode drives the host rule:
  #   "wildcard": routes *.<config.tenancy.baseDomain> AND the apex to Kairos
  #               (subdomain tenancy, KAIROS-A-0005 §2). Needs wildcard DNS + a
  #               wildcard TLS cert (DNS-01 with cert-manager, or a provided
  #               secret).
  #   "single":   routes a single host (below) to Kairos (single-tenant mode).
  tenancyMode: wildcard
  # -- Host to route in "single" tenancyMode. In "wildcard" mode the host is
  # derived from config.tenancy.baseDomain (apex + *.apex).
  host: kairos.example.com
  # -- HTTP path prefix (Kairos serves everything from /).
  path: /
  pathType: Prefix
  tls:
    # -- Enable a TLS block on the Ingress.
    enabled: false
    # -- Name of the TLS Secret. With cert-manager this is where the issued
    # cert lands (referenced by the annotation above); or point at a Secret you
    # created. Empty lets the ingress controller's default cert apply.
    secretName: ""

autoscaling:
  # -- Enable a HorizontalPodAutoscaler. When true, replicaCount is ignored.
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  # -- Target average CPU utilization (percentage of the request).
  targetCPUUtilizationPercentage: 70
  # -- Optional target average memory utilization; null disables the metric.
  targetMemoryUtilizationPercentage: null

metrics:
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor scraping /metrics
    # (KAIROS-A-0013, KAIROS-T-0049). Requires the monitoring.coreos.com CRDs.
    enabled: false
    # -- Scrape interval.
    interval: 30s
    # -- Scrape timeout.
    scrapeTimeout: 10s
    # -- Extra labels on the ServiceMonitor (e.g. to match your Prometheus'
    # serviceMonitorSelector, {release: kube-prometheus-stack}).
    labels: {}

# Non-secret application configuration. These become a ConfigMap that the
# Deployment loads via envFrom. Every value maps to an env var the server reads
# (KAIROS-A-0013 config surface). DATABASE_URL is NOT here — it is a secret, see
# `database` below.
config:
  oidc:
    # -- OIDC_ISSUER_URL — your external issuer (KAIROS-A-0016). REQUIRED.
    # e.g. https://idp.example.com/ (Okta, Entra ID, Auth0, Keycloak, Dex, …).
    issuerUrl: ""
    # -- OIDC_AUDIENCE — the `aud` tokens must carry (the API audience / client
    # id). REQUIRED. Also accepts a LIST (or a comma-separated string) for IdPs
    # that mint a distinct `aud` per OAuth client with no shared-audience
    # mechanism — notably Google Workspace (KAIROS-T-0055); a token matching
    # ANY listed audience validates:
    #   audience:
    #     - gui-id.apps.googleusercontent.com
    #     - cli-id.apps.googleusercontent.com
    audience: ""
  # -- KAIROS_WEB_CLIENT_ID — the public OAuth client id the GUI uses for PKCE.
  webClientId: kairos-web
  # -- KAIROS_API_BEARER — which OIDC token the GUI/CLI send as the API bearer
  # (KAIROS-T-0054): "access_token" (default; Dex, Keycloak, and any issuer that
  # mints JWT access tokens) or "id_token" (issuers whose access token is opaque
  # and cannot be validated by local JWKS — notably Google / Google Workspace).
  apiBearer: access_token
  # -- KAIROS_WEB_CLIENT_SECRET — OAuth client secret for a CONFIDENTIAL GUI
  # client (KAIROS-T-0056). A SECRET. Leave empty for public clients
  # (Dex/Keycloak). REQUIRED for Google Workspace, whose "Web application" OAuth
  # clients reject the token exchange without it even under PKCE. The server-side
  # token relay presents it; it never reaches the browser. Provide it EITHER
  # inline here (the chart renders a Secret) OR via webClientSecretExistingSecret
  # (recommended for production — keep it out of values/release history).
  webClientSecret: ""
  # -- Name of a pre-existing Secret holding KAIROS_WEB_CLIENT_SECRET. When set,
  # the chart does NOT render one and reads from this instead.
  webClientSecretExistingSecret: ""
  # -- Key within webClientSecretExistingSecret that holds the secret value.
  webClientSecretExistingSecretKey: KAIROS_WEB_CLIENT_SECRET

  tenancy:
    # -- KAIROS_BASE_DOMAIN — wildcard subdomain tenancy: acme.<baseDomain>
    # resolves to tenant "acme" (KAIROS-A-0005 §2). Set EXACTLY ONE of this or
    # singleTenant. Leave empty when using singleTenant.
    baseDomain: ""
    # -- KAIROS_SINGLE_TENANT — pin one tenant slug and skip subdomain
    # resolution (evaluation installs, no wildcard DNS). Set EXACTLY ONE of
    # this or baseDomain. Leave empty when using baseDomain.
    singleTenant: ""

  # -- KAIROS_DEPLOYMENT_ADMINS — comma-separated OIDC `sub`s allowed to call
  # the cross-tenant admin routes (POST /api/admin/tenants). Set this to your
  # own OIDC sub to bootstrap a fresh install (see README).
  deploymentAdmins: ""

  log:
    # -- KAIROS_LOG_LEVEL — tracing filter directive.
    level: info
    # -- KAIROS_LOG_FORMAT — json (default) or pretty.
    format: json

  # -- Trace export (KAIROS-T-0196). Off unless `endpoint` is set: no exporter is
  # built and no span leaves the process.
  otel:
    # -- KAIROS_OTEL_ENDPOINT — the OTLP/HTTP **traces** endpoint. Note the path
    # and the port: Kairos exports over HTTP (4318), not gRPC (4317), so this is
    # e.g. `http://otel-collector.observability:4318/v1/traces`. Pointing it at a
    # gRPC port gives you a connection that accepts and then rejects the payload,
    # which is a confusing way to find out.
    endpoint: ""
    # -- KAIROS_OTEL_SAMPLE_RATIO — head sampling, 0.0–1.0. Emitted only when set;
    # the server defaults to 1.0, because someone who configured a collector wants
    # to see spans in it. Turn it down on a busy deployment. Tail sampling (keep
    # the slow and failed traces) belongs in your collector, which can see a whole
    # trace where this process cannot.
    sampleRatio: ""

  # Data retention (KAIROS-A-0004 / KAIROS-A-0013). Defaults match the server's
  # built-in defaults; only overridden values are emitted into the ConfigMap.
  retention:
    # -- KAIROS_HISTORY_HOT_DAYS — hot-window length (server default 90).
    historyHotDays: null
    # -- KAIROS_HISTORY_KEEP_LATEST — latest-N version guard (server default 5).
    historyKeepLatest: null
    # -- KAIROS_ACTIVITY_RETENTION_DAYS — activity_log window (default 365).
    activityRetentionDays: null
    # -- KAIROS_ARCHIVE_TARGET — NDJSON offload target: a filesystem path or an
    # s3://… URL. Empty means no target (archive mode then prunes nothing).
    archiveTarget: ""
    # -- KAIROS_RETENTION_MODE — archive | discard | off (server default
    # archive: nothing is destroyed without an offload copy).
    mode: ""

  # -- KAIROS_DEV_UI — mount the Swagger UI at /api/docs. Keep false in
  # production (KAIROS-A-0005 §6: dev builds only).
  auth:
    # -- KAIROS_AUTH_MAX_FAILURES (KAIROS-T-0202) — failed authentications
    # allowed inside the window before a lockout. Emitted only when set;
    # the server's default is 5. Set "0" to turn throttling OFF.
    maxFailures: ""
    # -- KAIROS_AUTH_FAILURE_WINDOW_SECS — how long failures accumulate before
    # they are forgotten. Emitted only when set; the default is 300.
    failureWindowSecs: ""
    # -- KAIROS_AUTH_LOCKOUT_SECS — how long a lockout lasts. Emitted only when
    # set; the default is 60, short on purpose so a mistyped password is not a
    # support request and a lockout is not a denial-of-service.
    lockoutSecs: ""
    # -- KAIROS_TRUSTED_PROXY — trust X-Forwarded-For for the client address.
    # Empty FOLLOWS ingress.enabled, which is the right answer either way:
    # behind an Ingress the socket peer is the controller, so the header is the
    # only real client address; with no Ingress the header is caller-supplied
    # and trusting it would hand an attacker a new identity per request. Set
    # "true" explicitly when you front Kairos with a gateway of your own.
    trustedProxy: ""

  # -- Local password accounts (KAIROS-T-0203, KAIROS-I-0018).
  localAuth:
    # -- Accept local accounts in ADDITION to the issuer above. With this false
    # (the default), KAIROS_LOCAL_AUTH is off and /api/login is not routed — a
    # deployment with an issuer has no password endpoint to attack.
    #
    # Accounts are created by an org admin. There is no self-service sign-up and
    # no password-reset email; the intended uses are a small team with no
    # identity provider, and a break-glass admin for when an issuer is down.
    enabled: false
    # -- KAIROS_SESSION_TTL_SECS — how long a session bearer lasts. Emitted only
    # when set; the server's default is 1209600 (14 days).
    sessionTtlSecs: ""

  devUi: false

# -- A bundled Dex, FOR EVALUATION ONLY (KAIROS-T-0200, KAIROS-I-0018).
#
# Kairos requires an OIDC issuer to start, so evaluating it meant running Dex by
# hand or standing up a cloud OAuth client. This exists so `helm install` with a
# host and a password hash produces something you can log into.
#
# IT IS NOT FOR PRODUCTION, and the reasons are worse than the bundled database's.
# One replica, in-memory storage — so every restart invalidates every token and
# signs with fresh keys — static users, and a password hash in your values file
# and your release history. There is no user lifecycle, no password reset, no MFA
# and no audit trail. Point `config.oidc.issuerUrl` at a real issuer before anyone
# who is not you logs in. Setting BOTH is refused at render time.
#
# It also needs an ingress, which the bundled database does not: an issuer URL is
# an identity stamped into every token, so the browser and the server have to use
# the same one, and an in-cluster Service name is not reachable from a browser.
dex:
  # -- Run a Dex inside the release. THREE states, not two:
  #
  #   unset (default) — ON, unless config.oidc.issuerUrl names an issuer
  #   true            — ON, and naming an issuer is refused
  #   false           — OFF, exactly the pre-bundle chart
  #
  # Unset is what makes `helm upgrade` safe for existing releases: they all name
  # an issuer, so they all resolve to OFF and keep it.
  enabled:
  # -- Dex image. Pinned, as every image in this chart is (KAIROS-A-0013).
  image:
    repository: ghcr.io/dexidp/dex
    tag: "v2.43.1"
    pullPolicy: IfNotPresent
  # -- The one static user the bundled Dex knows about.
  adminEmail: ""
  # -- Its bcrypt hash. **REQUIRED when Dex is bundled**, because the chart ships
  # no default — a default would be a known credential in every Kairos install.
  # Generate one without installing anything:
  #
  #   docker run --rm httpd:2.4 htpasswd -bnBC 10 "" 'your-password' | tr -d ':\n'
  adminPasswordHash: ""
  # -- Extra static users, same shape: {email, username, userID, hash}.
  extraUsers: []
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

# -- A bundled PostgreSQL, FOR EVALUATION ONLY (KAIROS-A-0021 rule 2,
# KAIROS-T-0188).
#
# Kairos requires the `pgvector` extension, so "bring your own Postgres" now
# carries a condition an operator may not be able to satisfy on the first
# afternoon. This exists so `helm install` with nothing but the two OIDC values
# produces something that runs.
#
# IT IS NOT FOR PRODUCTION. One replica, one PVC, no backups, no failover, and a
# password sitting in values. Disable it and point `database.url` at a managed
# instance — RDS, Cloud SQL and Azure all offer pgvector. Setting BOTH is refused
# at render time rather than silently preferring one.
postgresql:
  # -- Run a Postgres inside the release. THREE states, not two:
  #
  #   unset (this default) — on, UNLESS you set database.url/existingSecret
  #   true                 — on, and naming an external database is an error
  #   false                — off; exactly the chart as it was before the bundle
  #
  # Unset is what makes `helm upgrade` safe for releases that already exist:
  # those all name a database, so they keep it without editing anything. A plain
  # `true` default would have failed their next upgrade, or quietly stood a
  # second database up beside the real one.
  enabled:
  # -- The image. Must carry pgvector; the plain `postgres` image does not.
  image:
    repository: pgvector/pgvector
    tag: pg16
    pullPolicy: IfNotPresent
  # -- Database name, user, and password. The password is evaluation-grade by
  # definition — it is in values and in the release history. It is a fixed
  # default rather than a generated one so that `helm upgrade` does not change it
  # out from under the volume that still holds the old one.
  auth:
    database: kairos
    username: kairos
    password: kairos-evaluation-only
  # -- Storage for the PVC. `size: 0` uses an emptyDir instead, which loses the
  # data on restart — occasionally what a throwaway demo wants, never what
  # anything else does.
  persistence:
    size: 8Gi
    storageClass: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

database:
  # -- DATABASE_URL for the external Postgres (KAIROS-A-0013: sole state). This
  # is a SECRET. Provide it EITHER inline here (the chart renders a Secret) OR
  # via existingSecret (recommended for production — keep secrets out of
  # values). e.g. postgres://kairos:PASSWORD@my-pg:5432/kairos
  #
  # Leave BOTH empty to use the bundled `postgresql` above. Setting either while
  # `postgresql.enabled` is true is refused: an upgrade that quietly preferred
  # one would either abandon the operator's real database or stand a second one
  # up beside it.
  url: ""
  # -- Name of a pre-existing Secret holding the DATABASE_URL. When set, the
  # chart does NOT render a Secret and reads from this one instead.
  existingSecret: ""
  # -- Key within existingSecret that holds the connection URL.
  existingSecretKey: DATABASE_URL

# -- Semantic retrieval (KAIROS-A-0021). The local model ships inside the image,
# so retrieval works with none of this set. Point `url` at an OpenAI-compatible
# endpoint to use one instead.
embeddings:
  # -- `local` | `remote` | `none`. Empty means local, the image's own model.
  # `none` turns embeddings off entirely: search still works, from text alone.
  provider: ""
  # -- OpenAI-compatible base URL, e.g. https://api.openai.com/v1. Setting this
  # selects the remote provider on its own.
  url: ""
  # -- Model name to request from that endpoint.
  model: ""
  # -- The API key. A SECRET, and handled like `database.url`: inline here (the
  # chart renders a Secret) or via existingSecret. A local Ollama needs none.
  apiKey: ""
  # -- Name of a pre-existing Secret holding the API key.
  existingSecret: ""
  # -- Key within existingSecret that holds it.
  existingSecretKey: KAIROS_EMBED_API_KEY

# -- Extra environment variables appended verbatim to the container. Each entry
# is a standard EnvVar (name/value or name/valueFrom). Use for anything not
# surfaced above.
extraEnv: []
#  - name: RUST_BACKTRACE
#    value: "1"

# -- Extra volumes for the pod (e.g. a PVC for a filesystem KAIROS_ARCHIVE_TARGET).
extraVolumes: []
# -- Extra volume mounts for the container.
extraVolumeMounts: []

# Probes. Liveness hits /healthz (process-only), readiness hits /readyz (DB +
# pending-migration check), and an optional startupProbe covers slow first-boot
# migrations (KAIROS-T-0007) before liveness starts counting.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
startupProbe:
  # -- Enable a startupProbe (recommended when boot migrations may be slow).
  enabled: true
  httpGet:
    path: /readyz
    port: http
  # Allow up to failureThreshold*periodSeconds for the first successful /readyz.
  periodSeconds: 5
  failureThreshold: 30

# -- Node selector for pod scheduling.
nodeSelector: {}
# -- Tolerations for pod scheduling.
tolerations: []
# -- Affinity rules for pod scheduling.
affinity: {}
# -- Topology spread constraints (e.g. spread replicas across zones).
topologySpreadConstraints: []
