# Sole job: 301 anything arriving over plain HTTP to the same URL on HTTPS.
#
# Why this exists as its own listener rather than a branch inside kairos:
# `tailscale serve` forwards X-Forwarded-For and X-Forwarded-Host but NOT
# X-Forwarded-Proto (measured 2026-09-26), so a request proxied from :80 and one
# proxied from :443 arrive at kairos indistinguishable. The listening port is
# the only available signal, so :80 has to land somewhere that is not kairos.
#
# $host is the client's Host header, which tailscale preserves, so this works
# for any tailnet name without being told what it is.
server {
    listen 8081;
    server_name _;
    # 301, not 302: this mapping is permanent, and a cached redirect is a
    # feature here — it stops the insecure door being used at all after one
    # visit.
    return 301 https://$host$request_uri;
}
